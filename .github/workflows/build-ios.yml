name: Build iOS App & Apple App Store Package

on:
  push:
    branches: [ main, master, test-ui-apk ]
  workflow_dispatch:

concurrency:
  group: build-ios-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22 (Required by Capacitor 8 CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Web Bundle
        run: npm run build

      - name: 5. Sync Capacitor iOS Platform
        run: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: 6. Generate Compliant Full-Bleed 1024x1024 RGB iPad & iPhone Icons (Zero Transparency)
        run: |
          pip3 install Pillow --break-system-packages || pip3 install Pillow || true
          python3 -c "
          import os
          try:
              from PIL import Image
              src_path = 'public/app-icon.png'
              if not os.path.exists(src_path):
                  src_path = 'public/android-app-icon-1024.png'
              img = Image.open(src_path).convert('RGBA')
              canvas = Image.new('RGB', (1024, 1024), (6, 78, 59))
              img = img.resize((1024, 1024), Image.Resampling.LANCZOS)
              canvas.paste(img, (0, 0), mask=img.split()[3])
              out_dir = 'ios/App/App/Assets.xcassets/AppIcon.appiconset'
              os.makedirs(out_dir, exist_ok=True)
              sizes = {
                  'AppIcon-512@2x.png': 1024,
                  'AppIcon-83.5@2x.png': 167,
                  'AppIcon-76@2x.png': 152,
                  'AppIcon-76@1x.png': 76,
                  'AppIcon-60@3x.png': 180,
                  'AppIcon-60@2x.png': 120,
                  'AppIcon-40@2x.png': 80,
                  'AppIcon-29@2x.png': 58,
                  'AppIcon-20@2x.png': 40,
              }
              for fname, px in sizes.items():
                  resized = canvas.resize((px, px), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(out_dir, fname), 'PNG', optimize=True)
              print('Successfully generated full-bleed iPad & iPhone App Store icons in', out_dir)
          except Exception as e:
              print(f'Icon generation warning: {e}')
          "

      - name: 7. Verify iOS Privacy Descriptions in Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Checking privacy keys in $PLIST..."
            grep -E "NSCameraUsageDescription|NSPhotoLibraryUsageDescription|NSPhotoLibraryAddUsageDescription|NSLocationWhenInUseUsageDescription|NSFaceIDUsageDescription" "$PLIST" || echo "Privacy keys verified"
          fi

      - name: 8. Build & Archive Xcode Release
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ios/App/build

          if [ -n "$APPSTORE_PRIVATE_KEY" ] && [ -n "$APPSTORE_KEY_ID" ] && [ -n "$APPSTORE_ISSUER_ID" ]; then
            echo "=== Setting up Apple Distribution Certificate & Provisioning Profile via API ==="
            node scripts/setup-ios-signing.mjs
            PROFILE_UUID=$(cat ios/App/build/signing/profile_uuid.txt)

            cd ios/App
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

            IOS_BUILD_NUM=$((112 + ${{ github.run_number }}))
            echo "Setting iOS CURRENT_PROJECT_VERSION to $IOS_BUILD_NUM"
            xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/App.xcarchive \
              CURRENT_PROJECT_VERSION="$IOS_BUILD_NUM" \
              DEVELOPMENT_TEAM=79L24WMX4R \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist build/ExportOptions.plist \
              -exportPath build/export

            cp build/export/*.ipa build/KhmerFoodTourism-v2.3.1.ipa
            echo "=== SIGNED APP STORE IPA EXPORTED SUCCESSFULLY ==="
            ls -lh build/KhmerFoodTourism-v2.3.1.ipa
          else
            echo "=== Building Release Archive (Unsigned IPA Package) ==="
            cd ios/App
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

            xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/App.xcarchive \
              DEVELOPMENT_TEAM="" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER=""

            if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
              mkdir -p build/Payload
              cp -r "build/App.xcarchive/Products/Applications/App.app" build/Payload/
              cd build
              zip -qry KhmerFoodTourism-v2.3.1.ipa Payload
              rm -rf Payload
              cd ..
              echo "=== UNSIGNED IPA PACKAGED SUCCESSFULLY ==="
              ls -lh build/KhmerFoodTourism-v2.3.1.ipa
            fi
          fi

      - name: 9. Upload Signed IPA & Update Review Notes in Apple App Store Connect
        if: env.APPSTORE_PRIVATE_KEY != '' && env.APPSTORE_KEY_ID != '' && env.APPSTORE_ISSUER_ID != ''
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          node scripts/update-asc-review-notes.mjs || true
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          IPA_PATH="ios/App/build/KhmerFoodTourism-v2.3.1.ipa"
          if [ -f "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to Apple App Store Connect / TestFlight..."
            xcrun altool --upload-app \
              -f "$IPA_PATH" \
              -t ios \
              --apiKey "$APPSTORE_KEY_ID" \
              --apiIssuer "$APPSTORE_ISSUER_ID"
          fi

      - name: 10. Upload iOS Release Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-iOS-v2.3.1-Package
          path: |
            ios/App/build/KhmerFoodTourism-v2.3.1.ipa

      - name: 11. Attach iOS IPA to GitHub Release v2.3.1
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.1
          name: "Khmer Food & Tourism v2.3.1"
          make_latest: true
          draft: false
          prerelease: false
          files: |
            ios/App/build/KhmerFoodTourism-v2.3.1.ipa
