name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate Generated APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.8
          name: "Khmer Food & Tourism v1.3.8 (Custom App Icon, Replace Shop Photo & Viral TikTok/FB Destinations)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.3.8 (App Icon, Replace Shop Photo & Viral Travel Spots):**
            - 🌟 **បំពាក់រូបតំណាងកម្មវិធីថ្មី (Custom App Launcher Icon):** បំពាក់ Icon ផ្ដិលមាស និងប្រាសាទខ្មែរ រៀបចំតាមស្តង់ដារ Android Mipmap ពេញលេញ (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi, round, adaptive) ពេលដំឡើងលើទូរស័ព្ទនឹងចេញរូប Logo ថ្មីភ្លាមៗ។
            - 📸 **មុខងារប្តូររូបភាពហាងផ្ទាល់ខ្លួន (Replace Shop Photo):** បន្ថែមប៊ូតុង "ប្តូររូបភាពហាង" ក្នុងផ្ទាំងលម្អិតហាង អនុញ្ញាតឱ្យម្ចាស់ហាង និងអ្នកប្រើប្រាស់ Upload រូបភាពផ្ទាល់ពីទូរស័ព្ទ/កុំព្យូទ័រ ឬដាក់ URL រូបភាពជាក់ស្តែងបានយ៉ាងងាយស្រួល។
            - 🔥 **ផ្នែកកន្លែងដើរលេងល្បីលើ TikTok & Facebook (Viral Travel Spots):** បង្ហាញតំបន់ទេសចរណ៍ដែលគេពេញនិយមផុសច្រើនជាងគេ (ភ្នំខ្នងផ្សារ, កោះរ៉ុងសន្លឹម, ភ្នំគូលែន, មណ្ឌលគិរី, ភ្នំបូកគោ, អង្គរវត្ត, ផ្សារក្តាមកែប) ជាមួយស្លាកចំនួន Views និង Hashtags។
            - 🏷️ **ស្លាក "រូបតំណាង" (Sample Photo Label):** នៅលើរូបភាពទាំងអស់ ដើម្បីភាពច្បាស់លាស់។
            - 📧 **អ៊ីមែលសម្រាប់មតិកែលម្អ (Feedback Email):** `kftapp@gmail.com`
            - ⭐ **អត្ថប្រយោជន៍ VIP ទាំង ១០ យ៉ាងពេញលេញ (10 VIP Benefits)**
            - 🏷️ **តម្លៃសមាជិកភាព VIP $9.99 សម្រាប់ ៣៦៥ ថ្ងៃ (End of year promo)**
            - 🏦 **ឈ្មោះគណនីទទួលធនាគារ ABA៖** **CHEA KIMSENG**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
