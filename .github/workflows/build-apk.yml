name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Signed Android Release APK & Google Play Store AAB (V1/V2/V3 Play Protect Verified)
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon -x lint -x lintVitalRelease || ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename Signed APK & Play Store AAB Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK & AAB FILES ==="
          find . -name "*.apk" -o -name "*.aab" -ls
          mkdir -p android/app/build/outputs/apk/debug
          REL_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$REL_APK" ] && [ -f "$REL_APK" ]; then
            cp "$REL_APK" android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.1.0.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.1.0.apk
          fi
          REL_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$REL_AAB" ] && [ -f "$REL_AAB" ]; then
            cp "$REL_AAB" android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.1.0-PlayStore.aab
          fi
          ls -la android/app/build/outputs/apk/debug/

      - name: 10. Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-Release-Packages
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.aab

      - name: 11. Publish GitHub Release with APK & Play Store AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.0
          name: "Khmer Food & Tourism v2.1.0 (3-Language KH/EN/ZH + Google Maps Search Fix + Balanced App Icon)"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v2.1.0 (Build 73):**
            - 🌐 **១. បន្ថែមភាសាចិនសាមញ្ញ (Simplified Chinese - 中文) ជាភាសាទី ៣ (រួមជាមួយ ខ្មែរ និង English)៖**
              - អាចប្តូរភាសាភ្លាមៗដោយចុចតែ ១ ដង (`ខ្មែរ` | `EN` | `中文`) និងរក្សាទុកចំណូលចិត្តភាសារបស់អ្នកប្រើប្រាស់ម្នាក់ៗដោយស្វ័យប្រវត្តិ។
            - 🗺️ **២. កែសម្រួលប្រព័ន្ធស្វែងរក Google Maps & បន្ថែម «ភោជនីយដ្ឋាន ជំនោរក្បាលកោះ»៖**
              - គាំទ្រការស្វែងរកទីតាំងពិតៗជាភាសាខ្មែរ អង់គ្លេស និងចិន (រួមទាំងការលុប Zero-Width Space ក្នុងអក្សរខ្មែរ និងប៊ូតុងបើកស្វែងរកផ្ទាល់លើ Google Maps)។
            - 🎨 **៣. កែសម្រួលទំហំរូបសញ្ញា (App Icon) ជាមួយស៊ុមពណ៌សស្មើស្អាតជុំវិញគ្រប់ជ្រុង។**
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.aab
