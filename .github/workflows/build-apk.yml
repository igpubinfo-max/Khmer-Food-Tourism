name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Signed Android Release APK (V1/V2/V3 Play Protect Verified)
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease

      - name: 9. Locate and Rename Signed APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          mkdir -p android/app/build/outputs/apk/debug
          REL_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$REL_APK" android/app/build/outputs/apk/debug/KhmerFoodTourism-v1.9.6.apk
          ls -la android/app/build/outputs/apk/debug/

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.6
          name: "Khmer Food & Tourism v1.9.6 (Play Protect Signed APK, Adaptive Icon, Mobile Header Language Switch, VIP Expiry Reminders, Ordered Food Categories & Permanent Image Vault)"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.9.6 (Build 68):**
            - 🛡️ **១. កែលម្អការដំឡើង Android APK និងប្រព័ន្ធសុវត្ថិភាព Google Play Protect (Official V1/V2/V3 Signed Release APK):**
              - ចុះហត្ថលេខាឌីជីថលផ្លូវការ (Release Keystore V1/V2/V3 Signature) និងបន្ថែមការណែនាំជាភាសាខ្មែរច្បាស់លាស់សម្រាប់ការស្កេនសុវត្ថិភាពជាមួយ Google Play Protect («Scan app / ស្កេនកម្មវិធី») ដោយមិនចាំបាច់បិទ Play Protect ឡើយ។
            - 🎨 **២. រចនារូបតំណាងកម្មវិធីថ្មីស្របតាមស្តង់ដារ Android Adaptive Icon:**
              - រក្សាទុករូបភាពដើមទាំងស្រុង (ប្រាសាទអង្គរវត្ត មុខម្ហូបខ្មែរ និងអក្សរខ្មែរ «អាហារ & ទេសចរណ៍ខ្មែរ») ដោយមានស៊ុមពណ៌សមូលស្អាត និងគម្លាតសុវត្ថិភាព (Safe Padding) មិនឱ្យដាច់អក្សរ ឬរូបភាពលើគ្រប់ទូរស័ព្ទ Android។
            - 🌐 **៣. ប្តូរទីតាំងប៊ូតុងប្តូរភាសា (EN / ខ្មែរ) មកជិតរូបបេះដូងក្នុងរបារខាងលើ (Top Navigation Bar):**
              - រៀបចំប៊ូតុងបេះដូង (❤️) និងប៊ូតុងភាសា (🌐 EN/ខ្មែរ) ព្រមទាំងប៊ូតុងស្វែងរក (🔍) ឱ្យនៅជិតគ្នា ងាយស្រួលចុចលើអេក្រង់ទូរស័ព្ទដោយមិនលៀនចេញក្រៅអេក្រង់។
            - ⏰ **៤. ប្រព័ន្ធរំលឹកថ្ងៃផុតកំណត់ VIP ប្រចាំថ្ងៃ (៣ ថ្ងៃចុងក្រោយ) និងទម្លាក់មកគណនីធម្មតាដោយស្វ័យប្រវត្តិ:**
              - ផ្ញើសាររំលឹកដោយស្វ័យប្រវត្តិរៀងរាល់ថ្ងៃក្នុងរយៈពេល ៣ ថ្ងៃចុងក្រោយមុនផុតកំណត់ បង្ហាញកាលបរិច្ឆេទផុតកំណត់ និងចំនួនថ្ងៃនៅសល់យ៉ាងច្បាស់លាស់ និងទម្លាក់គណនីដែលផុតកំណត់មកជាគណនីធម្មតាភ្លាមៗ។
            - 🍲 **៥. រៀបចំបញ្ជីមុខម្ហូបតាមលំដាប់ប្រភេទ៖ ១. សម្ល • ២. ឆា • ៣. ស្ងោរ • ៤. បង្អែម:**
              - បែងចែកមុខម្ហូបខ្មែរទាំងអស់តាមក្រុមយ៉ាងត្រឹមត្រូវ ដោយគ្មានការស្ទួន និងងាយស្រួលស្វែងរក។
            - 💾 **៦. ប្រព័ន្ធរក្សាទុករូបភាពជាអចិន្ត្រៃយ៍ (Permanent Media Override Vault):**
              - រាល់រូបភាពដែល Admin បានផ្លាស់ប្តូរនៅក្នុងតំបន់ទេសចរណ៍ (Tourist Attractions) ហាងអាហារ (Shops) និងមុខម្ហូប (Food Menus) ត្រូវបានរក្សាទុកជាអចិន្ត្រៃយ៍ក្នុង Local Vault, IndexedDB និង Supabase Cloud ដោយមិនត្រឡប់ទៅរូបភាពដើមវិញឡើយនៅពេលអាប់ដេតកំណែថ្មី។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
