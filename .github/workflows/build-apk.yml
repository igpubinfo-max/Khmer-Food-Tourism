name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Android Debug APK
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.7.7.apk
          ls -la

      # - name: 9b. Build Signed Play Store AAB (Option B - Disabled until user explicitly requests .aab)
      #   run: |
      #     npm run build
      #     cp -rf dist/* android/app/src/main/assets/public/
      #     cd android
      #     ./gradlew bundleRelease --no-daemon -x lint -x lintVitalRelease
      #     AAB_FILE=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
      #     echo "Found AAB: $AAB_FILE"
      #     cp "$AAB_FILE" app/build/outputs/apk/debug/KhmerFoodTourism-v1.7.7.aab
      #     cp app/khmerfood-upload-key.jks app/build/outputs/apk/debug/khmerfood-upload-key.jks
      #     ls -la app/build/outputs/apk/debug/

      - name: 10. Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7.7
          name: "Khmer Food & Tourism v1.7.7 (Welcome Screen Calligraphy, 8s Intro & Full KHQR VIP)"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.7.6 (220+ Verified Restaurants & Cafes, 124 Scenic Destinations, Matched Food Photos & $2.99/30d • $4.99/90d VIP Plans):**
            - 🏪 **១. បន្ថែម និងធ្វើបច្ចុប្បន្នភាពហាងអាហារល្បីៗ កាហ្វេ (220 ហាង) និងតំបន់ទេសចរណ៍ (124 កន្លែង) ស្តង់ដារ Google Maps + Supabase Cloud:**
              - ធ្វើបច្ចុប្បន្នភាពរូបភាព ទីតាំងផែនទី GPS (`https://www.google.com/maps/search/?api=1&query=lat,lng`) តម្លៃ និងពិន្ទុវាយតម្លៃ (Rating & Reviews) ដូចក្នុង Google Maps សម្រាប់ហាងអាហារ និងហាងកាហ្វេទាំង 220 កន្លែង និងតំបន់ទេសចរណ៍ទាំង 124 កន្លែងទូទាំង ២៥ ខេត្ត-រាជធានី រួមទាំង Sync ចូលទៅក្នុង Supabase Cloud។
              - ផ្គូផ្គងរូបភាពមុខម្ហូបទាំង 100 មុខ និងមុខម្ហូបកំពុងល្បី (Trending Foods) ឱ្យត្រូវគ្នាជាមួយឈ្មោះម្ហូបពិតប្រាកដ 100%។
            - 👑 **២. កែសម្រួលតម្លៃ និងរយៈពេលកញ្ចប់សមាជិកភាព VIP ថ្មី៖**
              - កញ្ចប់ទី ១៖ **$2.99 USD សម្រាប់រយៈពេល 30 ថ្ងៃ (30 Days VIP)**។
              - កញ្ចប់ទី ២៖ **$4.99 USD សម្រាប់រយៈពេល 90 ថ្ងៃ (90 Days VIP)**។
            - 🔑 **៣. បន្ថែមប្រអប់បញ្ចូលសោរហ័ស Google Maps Places API Key (ប្រអប់ទី ៣) លើទំព័រដើម Admin Dashboard:**
              - អាចចុច **📋 Paste & រក្សាទុកភ្លាម** ឬ **💾 Save Key** ក្នុងប្រអប់ទី ៣ បានភ្លាមៗ។
            - 🗺️ **១. ភ្ជាប់ Google Maps Places API + ប្រព័ន្ធ Smart Cache (សន្សំកូតា $200/ខែ Free Credit):**
              - ស្វែងរកហាងអាហារ កាហ្វេ ភោជនីយដ្ឋាន ផ្លូវ និងតំបន់ទេសចរណ៍ពិតៗនៅភ្នំពេញ និងទូទាំង ២៥ ខេត្ត-រាជធានី រួមទាំងរូបភាពហាងពិតៗ (`Place Photos`) និងទីតាំង GPS ដូចក្នុង Google Maps។
              - **ប្រព័ន្ធ Smart Cache ឆ្លាតវៃ៖** នៅពេលមានអ្នកប្រើស្វែងរកហាងថ្មីជាលើកទី ១ កម្មវិធីរក្សាទុកឈ្មោះ ទីតាំង GPS និងរូបភាពហាងនោះទុកក្នុង Database និង Smart Cache។ នៅពេលអ្នកប្រើទី ២ ទី ៣... ស្វែងរកហាងដដែល វាទាញយកមកបង្ហាញភ្លាមៗដោយមិនកាត់កូតា Google Maps ម្តងទៀតឡើយ!
            - ☁️ **២. ភ្ជាប់ប្រព័ន្ធ Supabase Cloud Database & Storage (Free Tier $0/ខែ):**
              - ធ្វើសមកាលកម្ម (Real-time Cloud Sync) សម្រាប់គណនីអ្នកប្រើប្រាស់ ហាងអាហារ និងរូបភាពភស្តុតាងបង់ប្រាក់ VIP រវាងទូរស័ព្ទអតិថិជនគ្រប់គ្នា និងទូរស័ព្ទ Admin។
              - បន្ថែមផ្ទាំងកំណត់ **Cloud Supabase & Google Maps API** ក្នុង Admin Dashboard ជាមួយប៊ូតុងសាកល្បងការភ្ជាប់ និងប៊ូតុងចម្លងកូដ SQL បង្កើតតារាងដោយ 1-Click។
            - 🧠 **១. ប្រព័ន្ធ AI Vision API ពិតប្រាកដ & ការវិភាគពណ៌ HSV ច្បាស់លាស់ (Real AI Vision & True HSV Fruit/Object Recognition):**
              - កំណត់អត្តសញ្ញាណ **ផ្លែល្ហុងទុំ / ល្ហុងទុំចិតរួច (Fresh Ripe Papaya)** និងផ្លែឈើស្រស់បានយ៉ាងត្រឹមត្រូវ ១០០% (មិនច្រឡំជាម្ហូបអាម៉ុកត្រីស្លឹកញ ឬសម្លម្ជូរព្រៃត្រីឆ្អើរឡើយ!)។
              - លុបបំបាត់ការបង្ខំឱ្យរូបភាពគ្រប់សន្លឹកត្រូវគ្នានឹងម្ហូបក្នុងឃ្លាំងទិន្នន័យ (Removed `allFoods[0]` fallback)។
              - គាំទ្រការភ្ជាប់ជាមួយ Backend AI Vision Proxy / Gemini Vision API ជាមួយប្រព័ន្ធ Cache និងការកំណត់កូតាប្រចាំថ្ងៃ (Free vs VIP)។
            - 📸 **២. មុខងារ «អាប់ឡូតភស្តុតាងបង់ប្រាក់» នៅក្រោម ABA KHQR (VIP Payment Proof Upload):**
              - បន្ថែមប៊ូតុង **«អាប់ឡូតភស្តុតាងបង់ប្រាក់»** នៅខាងក្រោមផ្នែកស្កេនកូដ ABA KHQR សម្រាប់ជ្រើសរើសរូបភាព Screenshot វិក្កយបត្រ (JPG, JPEG, PNG) ឬថតរូបផ្ទាល់។
              - អាចពិនិត្យមើលរូបភាពជាមុន (Preview) និងប្តូររូបភាពថ្មីមុនពេលបញ្ជូនទៅកាន់រដ្ឋបាល (Admin)។
            - 🛡️ **៣. ផ្ទាំងត្រួតពិនិត្យភស្តុតាងបង់ប្រាក់សម្រាប់ Admin (Admin Payment Proof Review & Approval):**
              - បង្ហាញរូបភាពវិក្កយបត្រ (Thumbnail) និងប៊ូតុង **«🔍 មើលភស្តុតាងពេញ (View Proof)»** ពេញអេក្រង់ក្នុងផ្ទាំង Admin Dashboard។
              - សកម្មភាពត្រួតពិនិត្យទាំង ៤ សម្រាប់ Admin៖ **មើលភស្តុតាងពេញ (View Proof)**, **អនុម័ត (Approve)**, **ស្នើសុំភស្តុតាងបន្ថែម (Request More Info)**, និង **បដិសេធ (Reject)**។
              - រូបមន្ត និងគ្រឿងផ្សំត្រូវបានទាញចេញពីឃ្លាំងទិន្នន័យផ្លូវការ ១០០% គ្មានការបង្កើតគ្រឿងផ្សំក្លែងក្លាយឡើយ (Never invent ingredients)។
            - 🍳 **២. ស្វែងរកមុខម្ហូបតាមគ្រឿងផ្សំដែលមាននៅផ្ទះ (Cook with What You Have):**
              - ជ្រើសរើសគ្រឿងផ្សំដែលមាននៅផ្ទះដើម្បីទទួលបានបញ្ជីមុខម្ហូបខ្មែរដែលត្រូវគ្នា ព្រមទាំងបង្ហាញគ្រឿងផ្សំដែលខ្វះខាត។
            - 🎯 **៣. ណែនាំមុខម្ហូបតាមចំណង់ចំណូលចិត្ត & សុខភាព (Personalized Taste & Diet Recommendations):**
              - តម្រៀបតាមរសជាតិ (ផ្អែម ជូរ ហឹរ ដិត/ប្រៃ) របបអាហារ (ម្ហូបបួស Vegetarian, អាហារសុខភាព Healthy) ថវិកា និងរយៈពេលចម្អិន។
            - 📍 **៤. ឆែកអ៊ីន & បញ្ជាក់ទីតាំងភោជនីយដ្ឋានពិតប្រាកដ (Smart Restaurant Discovery & GPS Check-in):**
              - ថតរូបនៅហាង និងទាញយកទីតាំង GPS ដើម្បីស្វែងរកភោជនីយដ្ឋានដែលនៅជិតបំផុត។
              - បញ្ជាក់សុពលភាពចម្ងាយ (Spatial Distance Verification ក្នុងរង្វង់ 500 ម៉ែត្រ) និងការពារទិន្នន័យផ្ទាល់ខ្លួន។
            - 👑 **៥. កំណត់កញ្ចប់សមាជិកភាព VIP យ៉ាងច្បាស់លាស់ ($2.99 និង $9.99):**
              - គម្រោងត្រីមាស $2.99 USD (៩០ ថ្ងៃ)៖ ស្កេន AI ១៥ ដង/ថ្ងៃ, Favorites រហូតដល់ ៣០, VIP Gold Badge, ភ្ជាប់ TikTok & Facebook។
              - គម្រោងប្រចាំឆ្នាំ $9.99 USD (៣៦៥ ថ្ងៃ)៖ ស្កេន AI គ្មានដែនកំណត់ (Unlimited), Favorites គ្មានដែនកំណត់, អាទិភាពបង្ហាញហាង, មុខងារសុខភាពកម្រិតខ្ពស់។
            - 📲 **១. បើក ABA Mobile ជាមួយ PayWay/KHQR Deep Link & ការណែនាំស្កេនលើទូរស័ព្ទដដែល (Direct Deep Link & Scanner Access):**
              - បន្ថែមប៉ារ៉ាម៉ែត្រផ្លូវការ `abamobilebank://ababank.com?type=payway&qrcode=...` ក្នុង Native Plugin ដើម្បីបញ្ជូនកូដ KHQR ផ្ទាល់ទៅក្នុង ABA Mobile។
              - រក្សាទុកកូដ QR ដោយស្វ័យប្រវត្តទៅក្នុង Photos / Gallery នៅពេលចុចប៊ូតុង។
              - បន្ថែមការណែនាំជាជំហានច្បាស់លាស់៖ ក្នុង ABA Mobile ចុច "ABA Scan" -> ចុច "Upload QR" នៅខាងក្រោម ដើម្បីជ្រើសរូបភាព QR ដែលបានរក្សាទុក ដោយមិនបាច់ស្វែងរក។
            - 💳 **២. លុបចោលប្រអប់វាយបញ្ចូលលេខកូដប្រតិបត្តិការដោយដៃ (Remove Manual Reference Input):**
