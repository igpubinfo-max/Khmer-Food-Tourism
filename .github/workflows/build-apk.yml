name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.4.5.apk
          ls -la

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.5
          name: "Khmer Food & Tourism v1.4.5 (External Telecom SMS OTP & Auto-Exit Mandatory Gate)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.4.5 (External Telecom SMS OTP & Auto-Exit Mandatory Gate):**
            - 📲 **១. លេខកូដ OTP មិនត្រូវបានបង្ហាញក្នុងកម្មវិធីឡើយ (No In-App OTP Display):**
              - លុបចោលទាំងស្រុងនូវផ្ទាំងបង្ហាញលេខកូដក្នុងកម្មវិធី (Removed in-app notification banner)។
              - លេខកូដសម្ងាត់ ៦ ខ្ទង់ ត្រូវបានបញ្ជូនទៅក្នុងទូរស័ព្ទរបស់អ្នកប្រើប្រាស់តាមរយៈប្រព័ន្ធក្រុមហ៊ុនទូរស័ព្ទចល័ត (Telecom SMS Operator) ឬប្រអប់សំបុត្រ Email ខាងក្រៅពិតប្រាកដ។
              - អ្នកប្រើប្រាស់ត្រូវពិនិត្យប្រអប់សារ SMS លើទូរស័ព្ទដៃ រួចយកលេខកូដមកវាយបញ្ចូលក្នុងប្រអប់ PIN ទាំង ៦។
            - 🚪 **២. ចាកចេញពីកម្មវិធីស្វ័យប្រវត្តិកាលណាគ្មានគណនី (Auto-Exit if No Account):**
              - កម្មវិធីទាមទារជាកាតព្វកិច្ចឱ្យមានគណនីដើម្បីចូលប្រើប្រាស់។
              - លុបចោលប៊ូតុងរុករកជាភ្ញៀវ និងប៊ូតុងបិទ (No guest bypass or close button)។
              - ប្រសិនបើអ្នកប្រើប្រាស់មិនបង្កើត ឬមិនចូលគណនីទេ ដោយចុចប៊ូតុងថយក្រោយ (Android Back Button) ឬចុច «ចាកចេញពីកម្មវិធី (Exit App)» កម្មវិធីនឹងបិទចាកចេញភ្លាមៗដោយស្វ័យប្រវត្តិ (Automatic App Exit)។
            - 🌐 **៣. ជម្រើសចូលគណនីងាយស្រួល ៣ ប្រភេទ (Google 1-Tap, Phone SMS OTP, Email)**។
            - 🔐 **៤. សុវត្ថិភាពទិន្នន័យកម្រិតខ្ពស់ និងគាំទ្រទូរស័ព្ទកម្ពុជា (+855)**។
            - 📧 **៥. អាសយដ្ឋានអ៊ីមែលផ្លូវការ `kftcam@gmail.com`**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
