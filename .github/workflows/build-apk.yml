name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Android Debug APK
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk KhmerFoodTourism-v1.9.5.apk
          ls -la

      # Play Store AAB build disabled during regular edits per user instruction (enable only when requested)
      # - name: 9b. Build Signed Play Store AAB
      #   run: |
      #     npm run build
      #     cp -rf dist/* android/app/src/main/assets/public/
      #     cd android
      #     ./gradlew bundleRelease --no-daemon -x lint -x lintVitalRelease
      #     AAB_FILE=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
      #     echo "Found AAB: $AAB_FILE"
      #     cp "$AAB_FILE" app/build/outputs/apk/debug/KhmerFoodTourism-v1.8.3.aab
      #     cp app/khmerfood-upload-key.jks app/build/outputs/apk/debug/khmerfood-upload-key.jks
      #     ls -la app/build/outputs/apk/debug/

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.5
          name: "Khmer Food & Tourism v1.9.5 (Safe Account Deletion, Full Admin Menu, Black Message Text & AI Payment Verification)"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.9.2 (Multiple Image Uploads at Once, Preview Lightbox & Reorder Controls):**
            - 📸 **១. បន្ថែមមុខងារជ្រើសរូបភាពច្រើនសន្លឹកក្នុងពេលតែមួយពី Gallery (Multiple Image Upload in One Step):**
              - អាប់ដេត Plugin Native Android ជាមួយ `Intent.EXTRA_ALLOW_MULTIPLE` និងមុខងារ Web Multi-file ឱ្យជ្រើសរើសរូបភាពច្រើនសន្លឹក (1, 3, 5, 10+ រូប) ពី Gallery ចូលក្នុងកម្មវិធីក្នុងពេលតែមួយ ដោយមិនចាំបាច់ផ្ទុកម្តងមួយសន្លឹកទៀតឡើយ។
              - បង្ហាញផ្ទាំង Progress និងចំនួនរូបភាពដែលបានបញ្ចូលជោគជ័យភ្លាមៗ។
            - 👁️ **២. ផ្ទាំងមើលរូបភាពធំ (Interactive Full-Screen Lightbox Preview):**
              - ចុចលើរូបភាពណាមួយដើម្បីបើកមើលទំហំធំ ច្បាស់ត្រជាក់ភ្នែក ជាមួយប៊ូតុងរំកិលមើលរូបមុន/រូបបន្ទាប់ (Previous / Next) មុននឹងសម្រេចចិត្តរក្សាទុក។
            - 🔄 **៣. រៀបចំលំដាប់លំដោយរូបភាព និងកំណត់រូបតំណាងហាងចម្បង (Reorder & Set Cover Photo):**
              - ប៊ូតុងរំកិលទៅឆ្វេង (◀) និងទៅស្តាំ (▶) នៅលើគ្រប់រូបភាពនីមួយៗ សម្រាប់រៀបចំលំដាប់រូបភាពតាមចិត្ត។
              - ប៊ូតុង «★ ដាក់ជារូបតំណាងហាង (Set as Main Cover)» សម្រាប់កំណត់រូបភាពណាមួយជារូបតំណាងហាងចម្បងបានភ្លាមៗ។
              - ប៊ូតុងលុប (🗑️) សម្រាប់ដករូបភាពណាដែលមិនចង់បានចេញ។
            - 💾 **៤. រក្សាទុកត្រឹមត្រូវ និងបង្ហាញគ្រប់រូបភាពទាំងអស់ក្នុងព័ត៌មានលម្អិតហាង (Shop Details):**
              - រាល់រូបភាពទាំងអស់ត្រូវបានរក្សាទុកចូលក្នុង `photoUrl`, `profileImage`, `foodImages`, និង `galleryPhotos` ទាំងក្នុងទូរស័ព្ទ (Persistent Local Storage) និង Supabase Cloud ដោយសុវត្ថិភាព ១០០%។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
