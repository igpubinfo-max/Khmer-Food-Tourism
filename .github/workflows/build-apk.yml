name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.4.2.apk
          ls -la

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.2
          name: "Khmer Food & Tourism v1.4.2 (Phone/Email Verification, Large Account Name, and Support Email Update)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.4.2 (Phone/Email Verification, Large Account Name, and Support Email Update):**
            - 🔐 **១. ប្រព័ន្ធផ្ទៀងផ្ទាត់គណនីពេលចុះឈ្មោះ (Phone & Email Verification with OTP):**
              - ការចុះឈ្មោះតាមលេខទូរស័ព្ទ ឬ អ៊ីមែល ត្រូវបានបំពាក់ដំណាក់កាលផ្ទៀងផ្ទាត់សុវត្ថិភាព (Verification Step)។
              - ប្រព័ន្ធផ្ញើ និងបង្ហាញលេខកូដសុវត្ថិភាព ៦ ខ្ទង់ភ្លាមៗ ជាមួយប៊ូតុងចុចបំពេញស្វ័យប្រវត្តិ (Auto-fill Code) និងរាប់ថយក្រោយ ៦០ វិនាទីសម្រាប់ផ្ញើម្តងទៀត។
              - គណនីទទួលបានស្លាកសញ្ញាបញ្ជាក់ **«✓ គណនីបានផ្ទៀងផ្ទាត់ (Verified Account)»** ពណ៌បៃតងស្រស់ស្អាត។
            - 👤 **២. ពង្រីកឈ្មោះគណនីឱ្យធំ ច្បាស់ និងទាក់ទាញ (Enlarged Prominent Account Name):**
              - ក្នុងទំព័រ Profile ឈ្មោះគណនីត្រូវបានពង្រីកទំហំអក្សរធំ និងដិតច្បាស់ល្អ (`font-moul text-lg sm:text-2xl`) រួមជាមួយរូបតំណាងគណនី (Avatar) ធំរលោង និងស្លាកសញ្ញាផ្ទៀងផ្ទាត់។
              - នៅលើទំព័រដើម (Home Screen) មានបំពាក់ពាក្យស្វាគមន៍ដោយបង្ហាញឈ្មោះអ្នកប្រើប្រាស់ផ្ទាល់ខ្លួនយ៉ាងច្បាស់។
            - 📧 **៣. ធ្វើបច្ចុប្បន្នភាពអាសយដ្ឋានអ៊ីមែលផ្លូវការ (Support/Feedback Email):**
              - ផ្លាស់ប្តូរអ៊ីមែលទទួលមតិកែលម្អពី `kftapp@gmail.com` ទៅជា **`kftcam@gmail.com`** ទាំងស្រុង។
            - 📸 **៤. បំពាក់រូបភាពដើមពិតប្រាកដចំនួន ១០០ មុខម្ហូបពី Magnific ក្នុង Asset កម្មវិធី**។
            - 🗺️ **៥. បញ្ជីរាយនាមកន្លែងទេសចរណ៍ ១១៩ កន្លែង គ្របដណ្តប់ ២៥ រាជធានី-ខេត្ត**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
