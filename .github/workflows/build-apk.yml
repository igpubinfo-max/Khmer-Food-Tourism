name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.5.0.apk
          ls -la

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.0
          name: "Khmer Food & Tourism v1.5.0 (Native Android Google Account Selector + Real Google OAuth)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.5.0 (Native Android Google Account Selector + Real Google OAuth):**
            - 🌐 **១. ជ្រើសរើស Gmail ដោយស្វ័យប្រវត្តិតាមរយៈ Native Android Account Selector:**
              - ប្រើប្រាស់ Android System Account Selector ផ្ទាល់ ដែលបង្ហាញបញ្ជី Gmail ដែលអ្នកប្រើប្រាស់កំពុង Login ក្នុងទូរស័ព្ទដៃ (Main Google Account សម្រាប់ Play Store / Gmail)។
              - មិនទាមទារ SHA-1 ឬការកំណត់ស្មុគស្មាញក្នុង Google Cloud Console ឡើយ ដំណើរការ ១០០% លើគ្រប់ទូរស័ព្ទ Android ទាំងអស់។
              - គ្រាន់តែចុចលើ Gmail របស់ខ្លួន នោះកម្មវិធីនឹង Register/Login ចូលភ្លាមៗដោយស្វ័យប្រវត្តិ។
            - 💻 **២. ដំណើរការ Google OAuth 2.0 Web Popup លើកុំព្យូទ័រ (ដូច Pacdora បេះបិទ)**។
            - 🚪 **៣. ចាកចេញពីកម្មវិធីស្វ័យប្រវត្តិប្រសិនបើគ្មានគណនី (Auto-Exit Mandatory Gate)**។
            - 🔐 **៤. ឥតគិតថ្លៃ ១០០% ជារៀងរហូត គ្មានការគិតថ្លៃសេវា SMS (Zero SMS fees)**។
            - 📧 **៥. អាសយដ្ឋានអ៊ីមែលផ្លូវការ `kftcam@gmail.com`**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
