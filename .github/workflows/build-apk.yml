name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.4.1.apk
          ls -la

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.1
          name: "Khmer Food & Tourism v1.4.1 (Mandatory Email/Phone Sign-Up & Clean User Management)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.4.1 (Mandatory Email/Phone Sign-Up & Clean User Management):**
            - 👤 **១. លុបគណនីលំនាំដើម (ចាន់ថា វណ្ណៈ) ចេញពីប្រព័ន្ធទាំងស្រុង:** គ្មានគណនីបន្លំ ឬ Demo ទៀតឡើយ។
            - 📱 **២. តម្រូវឱ្យចុះឈ្មោះគណនីថ្មីពេលដំឡើង App រួច (Mandatory Fast Sign-Up):**
              - អ្នកប្រើប្រាស់អាចចុះឈ្មោះបានយ៉ាងងាយស្រួល និងលឿនរហ័សបំផុត តាមរយៈ **លេខទូរស័ព្ទ (Phone Number)** ឬ **អ៊ីមែល (Email)**។
              - ត្រឹមតែបំពេញ **ឈ្មោះ** និង **លេខទូរស័ព្ទ/អ៊ីមែល** រួចចុច "ចុះឈ្មោះ និងចូលប្រើប្រាស់" គឺអាចចាប់ផ្តើមប្រើប្រាស់ភ្លាមៗ។
              - មានផ្ទាំង **ចូលគណនី (Sign In)** សម្រាប់អ្នកដែលមានគណនីស្រាប់។
            - 📸 **៣. បំពាក់រូបភាពដើមពិតប្រាកដចំនួន ១០០ មុខម្ហូបពី Magnific ក្នុង Asset កម្មវិធី**។
            - 🗺️ **៤. បញ្ជីរាយនាមកន្លែងទេសចរណ៍ ១១៩ កន្លែង គ្របដណ្តប់ ២៥ រាជធានី-ខេត្ត**។
            - ⚡ **៥. មុខងារពិសេសគណនីទាំង ៦ ចំណុច** (ថ្ងៃនេះញ៉ាំអ្វី, នៅជិតខ្ញុំ, កន្លែងថ្មីប្រចាំថ្ងៃ, បញ្ជីកន្លែងចង់ទៅ, ផែនការដើរលេង AI, ការជូនដំណឹង)។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
