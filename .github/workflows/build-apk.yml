name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main, master, test-ui-apk ]
  workflow_dispatch:

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Sync Version & Build Web Bundle
        run: |
          CURRENT_VC=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle || echo 1200)
          AUTO_VC=$((900 + ${{ github.run_number }}))
          if [ "$CURRENT_VC" -gt "$AUTO_VC" ]; then
            FINAL_VC=$CURRENT_VC
          else
            FINAL_VC=$AUTO_VC
          fi
          sed -i "s/versionCode [0-9]\+/versionCode $FINAL_VC/g" android/app/build.gradle
          sed -i "s/APP_BUILD_CODE: number = .*/APP_BUILD_CODE: number = $FINAL_VC;/g" src/types/index.ts
          echo "Synchronized Android versionCode and APP_BUILD_CODE to $FINAL_VC"
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          rm -rf android/app/src/main/assets/public && mkdir -p android/app/src/main/assets/public && cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build & V1+V2+V3 Sign Official APK, Direct-Install APK & Play Store AAB
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          FINAL_VC=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle || echo 1200)
          echo "Building Android APK & Play Store AAB with versionCode $FINAL_VC"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          mkdir -p release_out

          cd android
          chmod +x ./gradlew
          # 1) Official package (com.khmerfood.tourism) APK + Play Store AAB
          ./gradlew assembleRelease bundleRelease --no-daemon -x lint -x lintVitalRelease
          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$ZIPALIGN" -p -f 4 "$REL_APK" ../release_out/aligned-official.apk
          "$APKSIGNER" sign \
            --ks app/khmerfood-upload-key.jks \
            --ks-key-alias khmerfood-upload \
            --ks-pass pass:KhmerFood2026PlayStore \
            --key-pass pass:KhmerFood2026PlayStore \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out ../release_out/KhmerFoodTourism-v2.3.2.apk \
            ../release_out/aligned-official.apk
          rm -f ../release_out/aligned-official.apk
          "$APKSIGNER" verify --verbose ../release_out/KhmerFoodTourism-v2.3.2.apk

          REL_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$REL_AAB" ../release_out/KhmerFoodTourism-v2.3.2-PlayStore.aab

          # 2) Direct-Install Conflict-Free APK (com.khmerfood.tourism.direct) that bypasses Play Store signature lock
          ./gradlew assembleRelease -PcustomAppId=com.khmerfood.tourism.direct --no-daemon -x lint -x lintVitalRelease
          DIRECT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$ZIPALIGN" -p -f 4 "$DIRECT_APK" ../release_out/aligned-direct.apk
          "$APKSIGNER" sign \
            --ks app/khmerfood-upload-key.jks \
            --ks-key-alias khmerfood-upload \
            --ks-pass pass:KhmerFood2026PlayStore \
            --key-pass pass:KhmerFood2026PlayStore \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out ../release_out/KhmerFoodTourism-v2.3.2-DirectInstall.apk \
            ../release_out/aligned-direct.apk
          rm -f ../release_out/aligned-direct.apk
          "$APKSIGNER" verify --verbose ../release_out/KhmerFoodTourism-v2.3.2-DirectInstall.apk
          cd ..

          (cd release_out && zip -9 KhmerFoodTourism-v2.3.2-Android.zip KhmerFoodTourism-v2.3.2.apk KhmerFoodTourism-v2.3.2-DirectInstall.apk)
          ls -la release_out/

      - name: 9. Upload Android Packages Artifact (APKs + ZIP + Play Store AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-Release-Packages
          path: |
            release_out/KhmerFoodTourism-v2.3.2.apk
            release_out/KhmerFoodTourism-v2.3.2-DirectInstall.apk
            release_out/KhmerFoodTourism-v2.3.2-Android.zip
            release_out/KhmerFoodTourism-v2.3.2-PlayStore.aab

      - name: 10. Publish GitHub Release with Signed APKs, ZIP & Play Store AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.2
          name: "Khmer Food & Tourism v2.3.2"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែផ្លូវការ v2.3.2 (Official V1+V2+V3 Signed Production Packages):**
            - 📦 **KhmerFoodTourism-v2.3.2.apk:** Official Android APK (`com.khmerfood.tourism`, V1+V2+V3 signed).
            - ⚡ **KhmerFoodTourism-v2.3.2-DirectInstall.apk:** Instant Direct-Install APK (`com.khmerfood.tourism.direct`) — installs immediately even if the Google Play Store version is already on your phone!
            - 🗜️ **KhmerFoodTourism-v2.3.2-Android.zip:** Chrome-friendly ZIP package containing both APKs.
            - 🚀 **KhmerFoodTourism-v2.3.2-PlayStore.aab:** Signed Android App Bundle for Google Play Console.
          draft: false
          prerelease: false
          files: |
            release_out/KhmerFoodTourism-v2.3.2.apk
            release_out/KhmerFoodTourism-v2.3.2-DirectInstall.apk
            release_out/KhmerFoodTourism-v2.3.2-Android.zip
            release_out/KhmerFoodTourism-v2.3.2-PlayStore.aab
