name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Android Debug APK
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk KhmerFoodTourism-v1.9.0.apk
          ls -la

      # Play Store AAB build disabled during regular edits per user instruction (enable only when requested)
      # - name: 9b. Build Signed Play Store AAB
      #   run: |
      #     npm run build
      #     cp -rf dist/* android/app/src/main/assets/public/
      #     cd android
      #     ./gradlew bundleRelease --no-daemon -x lint -x lintVitalRelease
      #     AAB_FILE=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
      #     echo "Found AAB: $AAB_FILE"
      #     cp "$AAB_FILE" app/build/outputs/apk/debug/KhmerFoodTourism-v1.8.3.aab
      #     cp app/khmerfood-upload-key.jks app/build/outputs/apk/debug/khmerfood-upload-key.jks
      #     ls -la app/build/outputs/apk/debug/

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.0
          name: "Khmer Food & Tourism v1.9.0 (Persistent Photo Override Vault, Real Koh Pen Bamboo Bridge & Version-Proof Storage)"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.9.0 (Permanent Photo Overrides Vault, Real Koh Pen Bamboo Bridge & Anti-Reversion Guard):**
            - 🔒 **១. ប្រព័ន្ធរក្សាទុករូបភាពអចិន្ត្រៃយ៍មិនបាត់បង់ពេល Update កម្មវិធី (Persistent Photo Overrides Vault):**
              - បង្កើតថតផ្ទុកទិន្នន័យដាច់ដោយឡែក `kft_destination_photo_overrides_v1` សម្រាប់កត់ត្រារាល់រូបភាពដែល Admin បានកែប្រែដោយផ្ទាល់ (ទោះជា URL, File Upload, ឬ Base64)។
              - រាល់ពេលអាប់ដេតកំណែថ្មី ឬដំឡើង APK ថ្មី រូបភាពដែល Admin បានកែប្រែនឹងត្រូវរក្សាទុកដដែល ១០០% មិន Revert ទៅរូបភាពដើម (Default) វិញដាច់ខាត។
              - ការកែប្រែត្រូវអនុវត្តភ្លាមៗតែនៅពេលណាដែល Admin ចុចកែប្រែដោយផ្ទាល់ប៉ុណ្ណោះ។
            - 🌉 **២. ធ្វើបច្ចុប្បន្នភាពរូបថតពិតនៃស្ពានឫស្សីកោះប៉ែន (Real Koh Pen Bamboo Bridge dest-77):**
              - បានប្តូររូបថតស្ពានគីហ្សូណា (ស្ពានបេតុង) ចាស់ ទៅជារូបថតពិតជាក់ស្តែងនៃ «ស្ពានឫស្សីកោះប៉ែន» ខេត្តកំពង់ចាម ដែលជាស្ពានឫស្សីវែងបំផុតលើលោក (`/destinations/dest-77.jpg`)។
            - 🛡️ **៣. សុវត្ថិភាពទិន្នន័យទេសចរណ៍ ៣០០ កន្លែង និងការការពារ Duplicate:**
              - រក្សាការធ្វើសវនកម្មគ្មានទិន្នន័យត្រួតគ្នា (Zero Duplicates) និងប្រព័ន្ធទប់ស្កាត់ការ Duplicate ដោយស្វ័យប្រវត្តិ។
              - រាល់ការផ្លាស់ប្តូររូបភាពរបស់ Admin ត្រូវបានរក្សាទុកជាអចិន្ត្រៃយ៍ និងមិនបាត់បង់ឡើយ។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
