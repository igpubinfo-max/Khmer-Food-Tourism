name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate Generated APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.2
          name: "Khmer Food & Tourism v1.3.2 (Sample Photo Badges & iOS Direct Download Option)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.3.2 (Representative Photo Badges & Direct iOS Option):**
            - 📷 **បន្ថែមស្លាក "រូបតំណាង" (Sample Photo):** គ្រប់រូបភាពមុខម្ហូបទាំងអស់នៅទូទាំងកម្មវិធី (Food Cards, Food Detail Modal, Restaurant Menu) ត្រូវបានបំពាក់នូវស្លាកអក្សរតូចស្អាត "រូបតំណាង" នៅខាងស្តាំដៃផ្នែកខាងក្រោម ដើម្បីផ្តល់ព័ត៌មានច្បាស់លាស់ដល់អតិថិជន។
            - 🍎 **ប៊ូតុងដំឡើងសម្រាប់ Apple iOS (iPhone):** បន្ថែមប៊ូតុងដំឡើង iOS ដោយផ្ទាល់នៅក្បែរប៊ូតុងដំឡើង Android APK នៅទំព័រដើម (Hero Banner & Quick Showcase Card) រួមជាមួយការណែនាំដំឡើង Safari Add to Home Screen (PWA) និងតំណភ្ជាប់ Apple TestFlight។
            - 🛠️ **ដោះស្រាយបញ្ហាផ្ទាំងពណ៌សពេលបើកឡើងវិញ (Fixed Blank Screen on App Reopen):** ការពារ និងជម្រះទិន្នន័យខូចដោយស្វ័យប្រវត្តិកាលណាទូរស័ព្ទបើកកម្មវិធី ព្រមទាំងបំពាក់ប្រព័ន្ធ ErrorBoundary។
            - 🌿 **ស្ទីលពណ៌ភ្នែកស្រួលមើល (Eye-Friendly Clean White & Deep Emerald):** ផ្ទៃសទន់ភ្លឺស្រឡះ (#F8FAFC) មិនចាំងភ្នែក មិនព្រិលភ្នែក អក្សរខ្មៅដិតច្បាស់ (#0F172A) និងបៃតងត្បូងមរកតចាស់ (#064E3B)។
            - 🎁 **ចុះបញ្ជីហាងឥតគិតថ្លៃ $0 (Free Restaurant Listing):** ម្ចាស់ហាងអាចចុះឈ្មោះហាងដោយឥតគិតថ្លៃ ($0) បង្ហាញក្នុងបញ្ជីហាងទូទៅ។
            - ⭐ **សមាជិក VIP Premium $4.99 សម្រាប់ ១ ឆ្នាំ (365 ថ្ងៃ):** បង់តែម្តង $4.99 សម្រាប់រយៈពេល ៣៦៥ ថ្ងៃ (មិនមែនប្រចាំខែ គ្មានបន្តស្វ័យប្រវត្តិ) អាចដាក់ម្ហូប ៥ មុខ។
            - 🚫 **ដកមុខងារ QR Code របស់ភោជនីយដ្ឋានចេញទាំងស្រុង។**
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
