name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate Generated APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "Khmer Food & Tourism v1.2.0 (Dark Green & Light Green Premium Edition)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.2.0 (Dark Green & Light Green Premium Theme Edition):**
            - 🌿 **រចនាពណ៌បៃតងធម្មជាតិប្រណិត (Dark Green & Light Green):** រចនារូបរាងថ្មីស្រឡាងដោយប្រើពណ៌ Dark Forest Green (#0B3D2E, #14532D) និង Light Mint Green (#A7DCA5, #EAF6EC, #34A853) ស្រស់ស្អាត ងាយស្រួលមើល និងមានកម្រិត Contrast ច្បាស់ល្អបំផុត។
            - 🎁 **ចុះបញ្ជីហាងឥតគិតថ្លៃ $0 (Free Restaurant Listing):** ម្ចាស់ហាងអាចចុះឈ្មោះហាងដោយឥតគិតថ្លៃ ($0) បង្ហាញក្នុងបញ្ជីហាងទូទៅ រូបតំណាងហាង ១ សន្លឹក អាសយដ្ឋាន និងលេខទូរស័ព្ទ។
            - ⭐ **សមាជិក VIP Premium $4.99 សម្រាប់ ១ ឆ្នាំ (365 ថ្ងៃ):** បង់តែម្តង $4.99 សម្រាប់រយៈពេល ៣៦៥ ថ្ងៃ (មិនមែនជាការកាត់លុយប្រចាំខែ ឬបន្តស្វ័យប្រវត្តិឡើយ)។ អាចបញ្ចូលមុខម្ហូបបានរហូតដល់ ៥ មុខ ជាមួយរូបភាព តម្លៃជាដុល្លារ និងរៀល។
            - ⏳ **រក្សាទុកទិន្នន័យទាំងអស់ពេលផុតកំណត់ (No Data Loss):** នៅពេលផុតកំណត់ ៣៦៥ ថ្ងៃ ទិន្នន័យហាង និងមុខម្ហូបត្រូវបានរក្សាទុកបង្ហាញជាធម្មតា (មិនលុបចោលឡើយ)។
            - 🚫 **ដកមុខងារ QR Code របស់ភោជនីយដ្ឋានចេញទាំងស្រុង (No Restaurant QR Codes):** គ្មានការបង្កើត បង្ហាញ ឬគ្រប់គ្រង QR Code សម្រាប់ភោជនីយដ្ឋានទៀតឡើយ។
            - 🍲 **២០០+ មុខម្ហូបខ្មែរពិតៗ និង ១០០+ តំបន់ទេសចរណ៍:** មុខម្ហូបខ្មែរចម្រុះ ៨ ប្រភេទ និងតំបន់ទេសចរណ៍ទូទាំង ២៥ ខេត្តក្រុង។
            - 🛡️ **សុវត្ថិភាពខ្ពស់ និងរដ្ឋបាលតែម្នាក់គត់ (Strict Single Admin Security):** គ្រប់គ្រងសិទ្ធិដោយ PBKDF2-HMAC-SHA256, Cloud Firestore Security Rules រឹតបន្តឹង 5-item limit និងការពារមិនឱ្យអ្នកប្រើប្រាស់កែប្រែស្ថានភាព VIP ឬកាលបរិច្ឆេទដោយខ្លួនឯង។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
