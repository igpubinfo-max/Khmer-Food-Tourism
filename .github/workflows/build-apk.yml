name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.4.8.apk
          ls -la

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.8
          name: "Khmer Food & Tourism v1.4.8 (Real Device Google Account Linker)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.4.8 (Link Real Main Google Account on User Phone):**
            - 📲 **១. ភ្ជាប់គណនី Google ពិតប្រាកដនៅលើទូរស័ព្ទដៃអ្នកប្រើប្រាស់ (Real Device Google Account Linker):**
              - ភ្ជាប់ប្រព័ន្ធ Native Android Google Sign-In SDK (`play-services-auth`) ដើម្បីឱ្យប្រព័ន្ធ Android បង្ហាញគណនី Google ដែលអ្នកប្រើប្រាស់បាន Login លើទូរស័ព្ទដៃនោះពិតប្រាកដ (គណនី Google Play Store / Gmail លើទូរស័ព្ទ)។
              - លុបចោលទាំងស្រុងនូវឈ្មោះ ឬ Email ដែលបានកំណត់ទុកជាមុន (No hardcoded names/emails) ដើម្បីធានាថាអ្នកប្រើប្រាស់គ្រប់រូបភ្ជាប់គណនីផ្ទាល់ខ្លួនរបស់គាត់។
              - ទាញយកឈ្មោះ Email និងរូបតំណាងពិតប្រាកដមកចុះឈ្មោះជាគណនីធម្មតា (`role: 'user'`)។
            - 🚪 **២. ចាកចេញពីកម្មវិធីស្វ័យប្រវត្តិប្រសិនបើគ្មានគណនី (Auto-Exit Mandatory Gate)**។
            - 🔐 **៣. ឥតគិតថ្លៃ ១០០% ជារៀងរហូត គ្មានការគិតថ្លៃសេវា SMS (Zero SMS fees)**។
            - 📧 **៤. អាសយដ្ឋានអ៊ីមែលផ្លូវការ `kftcam@gmail.com`**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
