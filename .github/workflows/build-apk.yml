name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI button

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install NPM dependencies
        run: npm install

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Sync Capacitor Android
        run: npx cap sync android

      - name: 6. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Android APK File
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
