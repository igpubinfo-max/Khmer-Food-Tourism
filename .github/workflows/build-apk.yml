name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate Generated APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.3
          name: "Khmer Food & Tourism v1.3.3 (10 VIP Benefits, $9.99 Promo, Chea Kimseng ABA)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.3.3 (10 Premium VIP Benefits, $9.99 End-of-Year Promo, Chea Kimseng ABA):**
            - ⭐ **អត្ថប្រយោជន៍ VIP ទាំង ១០ យ៉ាងពេញលេញ (10 VIP Benefits):**
              1. បង្ហាញក្នុងបញ្ជីហាងឆ្នើម (Featured restaurant listing)
              2. ដាក់រូបភាពហាងច្រើនសន្លឹក Gallery (Multiple restaurant photos)
              3. មុខម្ហូប ៥ មុខ ជាមួយរូបភាព និងតម្លៃ (Up to 5 editable food menu items)
              4. កែប្រែព័ត៌មានហាង រូបភាព និងលេខទូរស័ព្ទដោយខ្លួនឯង (Self-service editing)
              5. តំណភ្ជាប់ចែករំលែកទំព័រហាងផ្ទាល់ (Shareable restaurant page link)
              6. ផ្លាកសញ្ញា VIP Premium លើបញ្ជី និងទំព័រហាង (Premium VIP badge)
              7. ស្ថិតិហាងផ្ទាល់៖ អ្នកមើល ចុចទូរស័ព្ទ ចុច Maps និងចែករំលែក (Restaurant analytics)
              8. បង្ហាញក្នុងផ្នែកផ្សព្វផ្សាយ VIP ពិសេស (Dedicated VIP promotion section)
              9. ប៊ូតុងខល ផែនទី និងចែករំលែករហ័ស (Easy-to-access call, map, and share buttons)
              10. សេវាជំនួយសមាជិក VIP ផ្ទាល់តាម Telegram (VIP member support channel)
            - 🏷️ **តម្លៃសមាជិកភាព VIP $9.99 សម្រាប់ ៣៦៥ ថ្ងៃ (End of year promo):** បង់តែមួយលើក $9.99 សម្រាប់រយៈពេល ៣៦៥ ថ្ងៃ (តម្លៃពិសេសត្រឹមដំណាច់ឆ្នាំនេះប៉ុណ្ណោះ គ្មានការកាត់ប្រាក់ប្រចាំខែ និងគ្មានការបន្តស្វ័យប្រវត្តិឡើយ)។
            - 🏦 **ឈ្មោះគណនីទទួលធនាគារ ABA៖** កែសម្រួលឈ្មោះគណនីទទួលធនាគារ ABA ទៅជា **CHEA KIMSENG**។
            - ⏱️ **លុបម៉ោងលើរូបភាពម្ហូបទាំងអស់ (Removed times from food pictures):** គ្មានការបង្ហាញម៉ោង ឬ cookTime badge ពីលើរូបភាពមុខម្ហូបឡើយ។
            - 📷 **រក្សាស្លាក "រូបតំណាង" (Sample Photo):** លើគ្រប់កាតមុខម្ហូប និងផ្ទាំងលម្អិតមុខម្ហូបទាំងអស់។
            - 🍎 **ប៊ូតុងដំឡើងសម្រាប់ iOS (Apple iPhone):** មានប៊ូតុង iOS ផ្ទាល់ និងការណែនាំ Safari Add to Home Screen (PWA) ពេញលេញ។
            - 🎁 **ចុះបញ្ជីហាងឥតគិតថ្លៃ $0 (Free Restaurant Listing):** ម្ចាស់ហាងអាចចុះឈ្មោះហាងដោយឥតគិតថ្លៃ ($0) បង្ហាញក្នុងបញ្ជីហាងទូទៅ។
            - 🚫 **គ្មានមុខងារ QR Code របស់ភោជនីយដ្ឋានឡើយ។**
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
