name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.4.4.apk
          ls -la

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.4
          name: "Khmer Food & Tourism v1.4.4 (Google Sign-In, Phone SMS OTP & Guest Browsing)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.4.4 (Google Sign-In, Phone SMS OTP, Email Verification & Guest Browsing):**
            - 🌐 **១. ជម្រើសចូលគណនី ៣ យ៉ាងងាយស្រួលបំផុត (Three Seamless Login Methods):**
              - **ក. បន្តជាមួយ Google (Continue with Google):** ជម្រើសណែនាំពិសេស (Recommended) ចុចចូលភ្លាមៗជាមួយគណនី Google លើទូរស័ព្ទដៃ ដោយមិនបាច់វាយលេខកូដ OTP ដោយដៃឡើយ។
              - **ខ. បន្តជាមួយលេខទូរស័ព្ទ (Continue with Phone):** គាំទ្រលេខទូរស័ព្ទកម្ពុជា (+855) ជាមួយការបញ្ជូនកូដ SMS OTP ៦ ខ្ទង់ និងប្រអប់ PIN ស្វ័យប្រវត្តិច្បាស់លាស់។
              - **គ. បន្តជាមួយអ៊ីមែល (Continue with Email):** ចុះឈ្មោះ និងផ្ទៀងផ្ទាត់តាមរយៈអាសយដ្ឋានអ៊ីមែល។
            - 🍽️ **២. អនុញ្ញាតឱ្យរុករកមុខម្ហូបជាភ្ញៀវដោយសេរី (Public Food Browsing as Guest):**
              - អ្នកប្រើប្រាស់ទូទៅអាចចូលមើលមុខម្ហូប ហាងអាហារ និងកន្លែងទេសចរណ៍ទាំងអស់ក្នុងប្រទេសកម្ពុជាបានដោយសេរី ដោយមិនទាមទារឱ្យចុះឈ្មោះជាមុនឡើយ។
              - តម្រូវឱ្យចុះឈ្មោះ ឬចូលគណនី សម្រាប់តែមុខងារផ្ទាល់ខ្លួនប៉ុណ្ណោះ (រក្សាទុកក្នុងបញ្ជីចំណូលចិត្ត, បញ្ចេញមតិវាយតម្លៃ, ចុះបញ្ជីហាងអាហារ, និងជាវកញ្ចប់ Premium)។
            - 🔐 **៣. សុវត្ថិភាពគណនី និងការការពារទិន្នន័យ (Enterprise Account Security):**
              - គ្មានការរក្សាទុកលេខកូដសម្ងាត់ ឬ OTP ជា Plaintext ឡើយ។
              - បែងចែកសិទ្ធិរដ្ឋបាលប្រព័ន្ធ (Private Admin) និងការពារសុវត្ថិភាពកម្រិតខ្ពស់ជាមួយ PBKDF2-HMAC-SHA256។
            - 👤 **៤. ឈ្មោះគណនីធំច្បាស់ល្អ រួមជាមួយរូបតំណាង Avatar និងស្លាកសញ្ញាផ្ទៀងផ្ទាត់ «✓ គណនីបានផ្ទៀងផ្ទាត់»**។
            - 📧 **៥. អាសយដ្ឋានអ៊ីមែលផ្លូវការ `kftcam@gmail.com`**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
