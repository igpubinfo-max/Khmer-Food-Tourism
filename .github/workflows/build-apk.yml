name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Signed Android Release APK (V1/V2/V3 Play Protect Verified)
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease || ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename Signed APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          mkdir -p android/app/build/outputs/apk/debug
          REL_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$REL_APK" ] && [ -f "$REL_APK" ]; then
            cp "$REL_APK" android/app/build/outputs/apk/debug/KhmerFoodTourism-v1.9.9.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KhmerFoodTourism-v1.9.9.apk
          fi
          ls -la android/app/build/outputs/apk/debug/

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.9
          name: "Khmer Food & Tourism v1.9.9 (Genuine VIP Shop Ratings & Simplified VIP Store Management)"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.9.9 (Build 71):**
            - ⭐ **១. កែសម្រួលប្រព័ន្ធផ្កាយ និងការវាយតម្លៃហាង VIP (Genuine Customer Rating Logic)៖**
              - ហាង VIP ដែលទើបចុះឈ្មោះថ្មី **មិនត្រូវបានដាក់ផ្កាយ 5 (5.0 ★) ដោយស្វ័យប្រវត្តិទៀតឡើយ**។
              - ប្រសិនបើហាងមិនទាន់មានអតិថិជនវាយតម្លៃ នឹងបង្ហាញ **«មិនទាន់មានការវាយតម្លៃ / No ratings yet»** យ៉ាងច្បាស់លាស់។
              - គណនាពិន្ទុផ្កាយមធ្យម និងចំនួនការវាយតម្លៃដោយផ្អែកលើការវាយតម្លៃពិតប្រាកដពីអតិថិជនតែប៉ុណ្ណោះ ព្រមទាំងបែងចែកដាច់ដោយឡែករវាង **ផ្លាកសញ្ញា VIP** **ការផ្ទៀងផ្ទាត់ហាង (Verified)** និង **ពិន្ទុវាយតម្លៃរបស់អតិថិជន**។
            - 🏪 **២. កែបញ្ហាបើកខុសហាង និងរចនាផ្ទាំង «គ្រប់គ្រងហាង VIP របស់ខ្ញុំ» ឱ្យងាយស្រួលប្រើបំផុត (Fix & Simplify VIP Store Management)៖**
              - កែបញ្ហាដែលចុច «គ្រប់គ្រងហាង VIP របស់ខ្ញុំ» បើកចំហាងចាស់ខុស ដោយផ្ទុកហាងត្រឹមត្រូវតាម `shop_id` និង `owner_id` ព្រមទាំងមានរបារជ្រើសរើសប្តូរហាង (Multi-Shop Switcher) ភ្លាមៗ។
              - រៀបចំផ្ទាំងគ្រប់គ្រងជា ៥ ផ្នែកដាច់ដោយឡែកពីគ្នា (`១. មុខម្ហូប`, `២. ព័ត៌មានហាង`, `៣. រូបភាពហាង`, `៤. ស្ថិតិ & ផ្កាយ`, `៥. គម្រោង VIP`) ជាមួយប៊ូតុង **បន្ថែមមុខម្ហូបថ្មី**, **កែប្រែ**, **លុប**, **រក្សាទុក** និងការបញ្ជាក់មុនពេលលុប។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
