name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Android Debug APK
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk KhmerFoodTourism-v1.9.1.apk
          ls -la

      # Play Store AAB build disabled during regular edits per user instruction (enable only when requested)
      # - name: 9b. Build Signed Play Store AAB
      #   run: |
      #     npm run build
      #     cp -rf dist/* android/app/src/main/assets/public/
      #     cd android
      #     ./gradlew bundleRelease --no-daemon -x lint -x lintVitalRelease
      #     AAB_FILE=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
      #     echo "Found AAB: $AAB_FILE"
      #     cp "$AAB_FILE" app/build/outputs/apk/debug/KhmerFoodTourism-v1.8.3.aab
      #     cp app/khmerfood-upload-key.jks app/build/outputs/apk/debug/khmerfood-upload-key.jks
      #     ls -la app/build/outputs/apk/debug/

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.1
          name: "Khmer Food & Tourism v1.9.1 (Instant PC Startup & VIP Store Submission Fix)"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.9.1 (Instant PC Startup & VIP Store Submission Fix):**
            - ⚡ **១. ដោះស្រាយបញ្ហាកម្មវិធីបើកយឺតលើ PC (Instant PC Startup & Zero Hang):**
              - បន្ថែម Timeout 3.5 វិនាទី និង AbortController លើរាល់ការហៅ Cloud API របស់ Supabase ការពារការកកស្ទះ (Hang up to 5 minutes) នៅពេលបណ្តាញ PC មានការរអាក់រអួល ឬ Firewall រារាំង។
              - កំណត់ពន្យារពេលការ Sync Cloud លើកដំបូងចំនួន 1.2 វិនាទី ដើម្បីឱ្យផ្ទាំង UI របស់កម្មវិធីបង្ហាញឡើងភ្លាមៗ (< 50ms) ពី Local Cache។
              - ដកចោលលក្ខខណ្ឌបង្កក Timer (`document.hidden`) ក្នុងផ្ទាំង Welcome Screen និងកាត់បន្ថយពេលវេលាបង្ហាញមកត្រឹម 3 វិនាទី រួមជាមួយការកត់ត្រា `kft_welcome_shown_v2` ក្នុង localStorage ការពារកុំឱ្យរាំងស្ទះដំណើរការបើកកម្មវិធីលើកក្រោយៗ។
            - 🏪 **២. កែសម្រួលការចុះបញ្ជីហាង VIP ឱ្យដំណើរការត្រឹមត្រូវ ១០០% (VIP Restaurant Submission Fix):**
              - ដោះស្រាយបញ្ហា Submit បង្កើតហាង VIP ថ្មីរួច ហើយបង្ហាញផ្ទាំងខុស «⛔ Unauthorized Restaurant - Malis Restaurant»: មុខងារ `addRestaurant` ឥឡូវប្រគល់ទិន្នន័យហាងថ្មីដែលទើបបង្កើតរួចដោយផ្ទាល់ ហើយបើកផ្ទាំង Manage Menu លើហាងរបស់ម្ចាស់នោះភ្លាមៗ។
              - កែសម្រួល Regex `isSeedRestaurantId` មិនឱ្យច្រឡំលេខសម្គាល់ហាង VIP ថ្មី (`rest-vip-...`) ជាមួយហាងលំនាំដើម (`rest-1` ដល់ `rest-250`)។
              - រក្សាទុកទិន្នន័យហាង VIP ថ្មីចូលក្នុង Persistent Local Storage ភ្លាមៗ និង Sync ទៅកាន់ Supabase Cloud ដោយស្វ័យប្រវត្តិ។
            - 🔒 **៣. រក្សាទុកអចិន្ត្រៃយ៍នូវរូបថតតំបន់ទេសចរណ៍ ៣០០ កន្លែង និងមុខម្ហូប ២០០ មុខ ដោយគ្មានការបាត់បង់ទិន្នន័យ។**
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
