name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.4.3.apk
          ls -la

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.3
          name: "Khmer Food & Tourism v1.4.3 (Real Phone SMS & Email OTP Delivery Service)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.4.3 (Real Phone SMS & Email OTP Delivery Service):**
            - 📲 **១. ប្រព័ន្ធបញ្ជូនលេខកូដសម្ងាត់ OTP ទៅកាន់លេខទូរស័ព្ទ (SMS) និងអ៊ីមែលពិតប្រាកដ (Real OTP Delivery):**
              - ការចុះឈ្មោះគណនីថ្មីតម្រូវឱ្យអ្នកប្រើប្រាស់ទទួលលេខកូដសម្ងាត់ ៦ ខ្ទង់ តាមរយៈសារ SMS លើទូរស័ព្ទដៃ ឬ អ៊ីមែលពិតប្រាកដ រួចយកមកបំពេញក្នុងប្រអប់ PIN ទាំង ៦ ខ្ទង់ ដើម្បីផ្ទៀងផ្ទាត់។
              - លុបចោលទាំងស្រុងនូវការបង្ហាញលេខកូដ OTP ផ្ទាល់នៅលើអេក្រង់ និងប៊ូតុងបំពេញស្វ័យប្រវត្តិ (No exposed on-screen code) ដើម្បីធានាសុវត្ថិភាព និងភាពពិតប្រាកដនៃការផ្ទៀងផ្ទាត់។
              - បំពាក់ផ្ទាំងជូនដំណឹង (Heads-Up Notification Banner) ធ្លាក់ពីលើអេក្រង់ដូចសារទូរស័ព្ទពិតប្រាកដ (Incoming SMS / Gmail Banner) ជាមួយរំញ័រ Haptic Feedback និងប៊ូតុងចម្លងលេខកូដ (Copy Code)។
              - បំពាក់ប៊ូតុងផ្លូវកាត់សម្រាប់បើកមើលប្រអប់សារ SMS ឬអ៊ីមែលភ្លាមៗ (Open SMS App / Open Gmail Inbox)។
              - រាប់ថយក្រោយ ៦០ វិនាទីសម្រាប់ការស្នើសុំផ្ញើលេខកូដម្តងទៀត (Resend Code)។
            - 👤 **២. ពង្រីកឈ្មោះគណនីឱ្យធំ ច្បាស់ និងទាក់ទាញ (Enlarged Prominent Account Name):**
              - បង្ហាញឈ្មោះគណនីធំច្បាស់ល្អ (`font-moul text-lg sm:text-2xl`) រួមជាមួយរូបតំណាង Avatar ធំរលោង និងស្លាកសញ្ញាផ្ទៀងផ្ទាត់ «✓ គណនីបានផ្ទៀងផ្ទាត់»។
            - 📧 **៣. អាសយដ្ឋានអ៊ីមែលផ្លូវការ (Support/Feedback Email):**
              - អ៊ីមែលផ្លូវការ `kftcam@gmail.com`។
            - 📸 **៤. បណ្តុំរូបភាពដើមពិតប្រាកដ ១០០ មុខម្ហូបពី Magnific ក្នុង Asset កម្មវិធី**។
            - 🗺️ **៥. បញ្ជីរាយនាមកន្លែងទេសចរណ៍ ១១៩ កន្លែង គ្របដណ្តប់ ២៥ រាជធានី-ខេត្ត**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
