name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.4.9.apk
          ls -la

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.9
          name: "Khmer Food & Tourism v1.4.9 (Pacdora-Style Real Google OAuth Integration)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.4.9 (Official Google OAuth Client ID Integration — Identical to Pacdora):**
            - 🌐 **១. ភ្ជាប់ Google OAuth 2.0 Client ID ផ្លូវការ (ដូច Pacdora បេះបិទ):**
              - ភ្ជាប់លេខកូដសម្គាល់ Client ID របស់គម្រោង៖ `834153814844-po5bjnuts0urg1imef38617kgpol1dq2.apps.googleusercontent.com`។
              - នៅពេលចុចលើ «Continue with Google» គឺវាបើកផ្ទាំងពិតរបស់ Google ពី `accounts.google.com` ដោយស្វ័យប្រវត្ត។
              - Google ស្គាល់ Gmail Account ដែលលោកអ្នកបាន Login ក្នុង Google Chrome ឬក្នុងទូរស័ព្ទដៃភ្លាមៗ។
              - មិនមានផ្ទាំងសរសេរដៃក្នុង App ទៀតឡើយ (Zero in-app mock dialogs)។
            - 🚪 **២. ចាកចេញពីកម្មវិធីស្វ័យប្រវត្តិប្រសិនបើគ្មានគណនី (Auto-Exit Mandatory Gate)**។
            - 🔐 **៣. ឥតគិតថ្លៃ ១០០% ជារៀងរហូត គ្មានការគិតថ្លៃសេវា SMS (Zero SMS fees)**។
            - 📧 **៤. អាសយដ្ឋានអ៊ីមែលផ្លូវការ `kftcam@gmail.com`**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
