name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate Generated APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Khmer Food & Tourism v1.0.0 (Updated Android APK)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.0.0 (Key Features & Security Hardening):**
            - 💳 **តម្លៃចុះបញ្ជីហាងប្រូម៉ូសិន $4.99 USD (Restaurant Registration $4.99 Promo):** ការទូទាត់តាម Bakong KHQR ជាមួយលេខកូដប្រតិបត្តិការ (Trx ID) និងការផ្ទៀងផ្ទាត់ផ្លូវការពីរដ្ឋបាលមុននឹងធ្វើឱ្យហាងសកម្ម។
            - 🍲 **២០០+ មុខម្ហូបខ្មែរពិតៗ (200+ Authentic Khmer Dishes):** រូបភាពច្បាស់ៗ ដកតម្លៃចេញពីរូបភាព គ្រឿងផ្សំ និងរបៀបចម្អិន ៨ ប្រភេទ (សម្ល, អាំង, ឆា, ញាំ, គុយទាវ/នំបញ្ចុក, បាយ, បង្អែម, អាហារសម្រន់)។
            - 🏪 **២០០+ ភោជនីយដ្ឋានទូទាំង ២៥ ខេត្តក្រុង (200+ Cambodian Restaurants):** គ្របដណ្តប់ទូទាំងប្រទេស បែងចែកច្បាស់លាស់រវាងហាងផ្ទៀងផ្ទាត់ផ្លូវការ និងគំរូសហគមន៍។
            - 🔙 **ប៊ូតុងត្រឡប់ Android (Hardware Back Button with Confirmation):** សួរបញ្ជាក់ “តើអ្នកចង់ចាកចេញពីកម្មវិធីមែនទេ?” ជាមួយប៊ូតុង “បាទ/ចាស” និង “បន្តប្រើប្រាស់” ការពារការចាកចេញដោយអចេតនានៅពេលបំពេញទម្រង់បែបបទ។
            - 📲 **ទាញយក និងដំឡើងងាយស្រួលទាំង Android & iOS:** គាំទ្រ Direct APK Download លើ Android និង Safari Add-to-Home-Screen PWA Guide លើ iPhone។
            - 🛡️ **សុវត្ថិភាពកម្រិតខ្ពស់ (Enterprise Security Hardening):** គណនីរដ្ឋបាលតែមួយគត់ ការពារដោយ PBKDF2-HMAC-SHA256 (100,000 Iterations), HMAC session tokens, Rate limiting & brute-force lockout, និង network-security-config (HTTPS only)។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
