name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate Generated APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.5
          name: "Khmer Food & Tourism v1.3.5 (Feedback Email & Cache Protection)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.3.5 (Feedback Email & Cache Protection):**
            - 📧 **បន្ថែមអ៊ីមែលសម្រាប់មតិកែលម្អ (Feedback Email):** បានបន្ថែម `kftapp@gmail.com` នៅខាងក្រោម Header Buttons, ក្នុងផ្ទាំង Support Modal, និងលើផ្ទាំង Error Recovery ជាមួយប៊ូតុងចម្លងអ៊ីមែលរហ័ស។
            - 🛡️ **ការការពារទិន្នន័យ Cache & Version Migration:** បានប្តូរ storage key ទៅ `kft_restaurants_membership_v2` និងបន្ថែម Version Auto-Purge ដើម្បីជម្រះទិន្នន័យចាស់ដែលខូច ឬមិនពេញលេញពីកំណែមុនៗចោលដោយស្វ័យប្រវត្តិ។
            - 🛠️ **ដោះស្រាយបញ្ហា ErrorBoundary:** ការពារសុវត្ថិភាពទិន្នន័យសម្រាប់ posts, comments, restaurants, foods, destinations ដើម្បីធានាមិនឱ្យមាន runtime error ឡើយ។
            - 🕒 **លុបម៉ោងបើក-បិទលើរូបភាពភោជនីយដ្ឋាន:** គ្មានការបង្ហាញម៉ោងបើក និងបិទលើផ្ទាំងរូបភាពភោជនីយដ្ឋានទៀតឡើយ។
            - ⭐ **អត្ថប្រយោជន៍ VIP ទាំង ១០ យ៉ាងពេញលេញ (10 VIP Benefits)**
            - 🏷️ **តម្លៃសមាជិកភាព VIP $9.99 សម្រាប់ ៣៦៥ ថ្ងៃ (End of year promo)**
            - 🏦 **ឈ្មោះគណនីទទួលធនាគារ ABA៖** **CHEA KIMSENG**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
