name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Sync Version & Build Web Bundle
        run: |
          CURRENT_VC=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle || echo 1257)
          AUTO_VC=$((900 + ${{ github.run_number }}))
          if [ "$CURRENT_VC" -gt "$AUTO_VC" ]; then
            FINAL_VC=$CURRENT_VC
          else
            FINAL_VC=$AUTO_VC
          fi
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle || echo "2.7.0")
          sed -i "s/versionCode [0-9]\+/versionCode $FINAL_VC/g" android/app/build.gradle
          sed -i "s/APP_BUILD_CODE: number = .*/APP_BUILD_CODE: number = $FINAL_VC;/g" src/types/index.ts
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "FINAL_VC=$FINAL_VC" >> $GITHUB_ENV
          echo "Synchronized Android versionCode to $FINAL_VC and versionName to $VERSION_NAME"
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Copy Web Assets directly into Android
        run: |
          rm -rf android/app/src/main/assets/public && mkdir -p android/app/src/main/assets/public && cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build & V1+V2+V3 Sign Single Direct-Install APK & Play Store AAB
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          FINAL_VC=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle || echo 1257)
          echo "Building Android APK & Play Store AAB with versionCode $FINAL_VC"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          mkdir -p release_out

          cd android
          chmod +x ./gradlew
          # 1. Build Play Store AAB with official Play Store package ID (com.khmerfood.tourism)
          ./gradlew bundleRelease --no-daemon -x lint -x lintVitalRelease
          REL_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$REL_AAB" ../release_out/CambodiaFlavorsTourism-v2.5.0-PlayStore.aab

          # 2. Build SINGLE APK with conflict-free package ID (com.khmerfood.tourism.direct)
          # Guarantees 1-tap installation on Samsung Android 15 without Play Store signature conflicts
          ./gradlew assembleRelease -PcustomAppId=com.khmerfood.tourism.direct --no-daemon -x lint -x lintVitalRelease
          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$ZIPALIGN" -p -f 4 "$REL_APK" ../release_out/aligned-official.apk
          "$APKSIGNER" sign \
            --ks app/khmerfood-upload-key.jks \
            --ks-key-alias khmerfood-upload \
            --ks-pass pass:KhmerFood2026PlayStore \
            --key-pass pass:KhmerFood2026PlayStore \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out ../release_out/CambodiaFlavorsTourism-v2.5.0.apk \
            ../release_out/aligned-official.apk
          rm -f ../release_out/aligned-official.apk
          "$APKSIGNER" verify --verbose ../release_out/CambodiaFlavorsTourism-v2.5.0.apk
          cd ..

          ls -la release_out/

      - name: 8. Upload Android Packages Artifact (Single APK + Play Store AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Cambodia-Flavors-Tourism-Release-Packages
          path: |
            release_out/CambodiaFlavorsTourism-v2.5.0.apk
            release_out/CambodiaFlavorsTourism-v2.5.0-PlayStore.aab

      - name: 9. Publish GitHub Release with Signed APK & Play Store AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-ui-apk'
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "Cambodia Flavors & Tourism v${{ env.VERSION_NAME }}"
          make_latest: true
          body: |
            ### 🇰🇭 Cambodia Flavors & Tourism v${{ env.VERSION_NAME }}
            **រសជាតិ និងទេសចរណ៍កម្ពុជា • 柬埔寨风味与旅游**

            **Official Release v${{ env.VERSION_NAME }} (Build ${{ env.FINAL_VC }}):**
            - 📱 **CambodiaFlavorsTourism-v${{ env.VERSION_NAME }}:** Signed Direct-Install APK for Android.
            - 📦 **CambodiaFlavorsTourism-v${{ env.VERSION_NAME }}-PlayStore.aab:** Signed Android App Bundle for Google Play Console.
          draft: false
          prerelease: false
          files: |
            release_out/CambodiaFlavorsTourism-v2.5.0.apk
            release_out/CambodiaFlavorsTourism-v2.5.0-PlayStore.aab

      - name: 10. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-ui-apk'
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
