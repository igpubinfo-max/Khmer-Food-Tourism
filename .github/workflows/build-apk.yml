name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate Generated APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.9
          name: "Khmer Food & Tourism v1.3.9 (Viral Review Spots on TikTok/FB & 6 Personalized Account Features)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.3.9 (TikTok & FB Viral Review Spots & 6 Personalized User Features):**
            - 🔥 **១. មុខងារថ្មីលើ Home Screen សម្រាប់កន្លែងដើរលេងដែលគេចូលចិត្តទៅ Review លើ TikTok & Facebook:** ផ្ទាំងពិសេសបង្ហាញតំបន់ទេសចរណ៍ល្បីៗដែលមានការ Review និងផុសច្រើនលើ TikTok និង Facebook រួមមានសម្រង់មតិរបស់អ្នក Review ផ្ទាល់ (Reviewer Quotes), ចំនួន Views រាប់លាន, ចំនួន Likes, និងប៊ូតុងស្វែងយល់លម្អិត។
            - 🍛 **២. A. ថ្ងៃនេះញ៉ាំអ្វី? (អាទិភាពខ្ពស់):** អ្នកប្រើចុចតែម្តង កម្មវិធីជ្រើសរើសម្ហូបជូនតាមថវិកា (<$3, $3-$7, >$7), ចំណង់ចំណូលចិត្ត (សម្ល, អាំង, ឆា, ញាំ, គុយទាវ, បង្អែម) និងទីតាំង។ មានប៊ូតុង **«បង្ហាញម្ហូបផ្សេងទៀត»** ដើម្បីប្តូរមុខម្ហូបថ្មីភ្លាមៗ!
            - 📍 **២. B. នៅជិតខ្ញុំ (Near Me):** រកហាងឆ្ងាញ់ៗ និងកន្លែងដើរលេងនៅក្បែរខ្លួន ដោយបង្ហាញចម្ងាយគិតជាគីឡូម៉ែត្រ (GPS), កម្រិតតម្លៃ ($/$$/$$$), និងប៊ូតុង **«នាំផ្លូវ (Google Maps)»** ទៅកាន់ទីតាំងផ្ទាល់។
            - ✨ **២. C. កន្លែងថ្មីប្រចាំថ្ងៃ (Daily Discoveries):** បង្ហាញហាងថ្មី ម្ហូបថ្មី និងទីតាំងប្លែកៗដែលមិនទាន់ស្គាល់ជាបញ្ជី **«ស្វែងយល់ថ្ងៃនេះ»** ដោយវិលជុំដោយស្វ័យប្រវត្តិតាមថ្ងៃដោយមិនបាច់បង្ហោះមាតិការាល់ថ្ងៃ។
            - 📑 **២. D. បញ្ជីកន្លែងដែលចង់ទៅ (Personalized Wishlists):** អ្នកប្រើប្រាស់អាចបង្កើត និងគ្រប់គ្រងបញ្ជីផ្ទាល់ខ្លួនដូចជា **«ហាងដែលចង់សាក»**, **«កន្លែងទៅជាមួយគ្រួសារ»**, និង **«កន្លែងចង់ទៅថ្ងៃអាទិត្យ»** រួមទាំងបង្កើតបញ្ជីថ្មីតាមចិត្ត។
            - 🤖 **២. E. ផែនការដើរលេង AI (AI Trip Planner):** ឱ្យ AI រៀបចំកាលវិភាគដើរលេងដោយស្វ័យប្រវត្តិ តាមថវិកា ចំនួនថ្ងៃ (១-៣ ថ្ងៃ) និងអ្នករួមដំណើរ (ម្នាក់ឯង, គូស្នេហ៍, មិត្តភក្តិ, គ្រួសារ) រួមទាំងហាងញ៉ាំអាហារ និងកន្លែងកម្សាន្ត។
            - 🔔 **២. F. ការជូនដំណឹងដែលមានប្រយោជន៍ (Helpful Notifications):** ជូនដំណឹងអំពីប្រូម៉ូសិនហាង VIP, ការបញ្ចុះតម្លៃ, និងកន្លែងថ្មីៗ ជាមួយកុងតាក់ **«បើក/បិទការជូនដំណឹង»** ដែលអ្នកប្រើអាចបិទបានតាមចិត្ត។
            - 🌟 **បំពាក់រូបតំណាងកម្មវិធីថ្មី (Custom App Launcher Icon):** រូបផ្ដិលមាស និងប្រាសាទខ្មែរ។
            - 📸 **មុខងារប្តូររូបភាពហាងផ្ទាល់ខ្លួន (Replace Shop Photo):** ប៊ូតុង "ប្តូររូបភាពហាង" ក្នុងផ្ទាំងលម្អិតហាង។
            - 📧 **អ៊ីមែលសម្រាប់មតិកែលម្អ (Feedback Email):** `kftapp@gmail.com`
            - 🏷️ **តម្លៃសមាជិកភាព VIP $9.99 សម្រាប់ ៣៦៥ ថ្ងៃ (End of year promo)**
            - 🏦 **ឈ្មោះគណនីទទួលធនាគារ ABA៖** **CHEA KIMSENG**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
