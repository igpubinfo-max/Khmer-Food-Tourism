name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.5.2.apk
          ls -la

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.2
          name: "Khmer Food & Tourism v1.5.2 (Premium VIP Upgrade & Subscription System)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.5.2 (Premium VIP Upgrade & Subscription Management System):**
            - 🌟 **១. ប្រព័ន្ធដំឡើងគណនី Premium VIP ($9.99 USD / ឆ្នាំ):**
              - រក្សាទុកគណនី និងទិន្នន័យដែលមានស្រាប់ ១០០% ដោយមិនបាច់ចុះឈ្មោះឡើងវិញ។
              - បង្ហាញស្ថានភាពសមាជិកភាព Free User និង Premium VIP លើ Profile, Account Settings, និង Membership page។
            - 💎 **២. អត្ថប្រយោជន៍ពិសេសទាំង ១០ សម្រាប់សមាជិក VIP (10 Premium VIP Benefits):**
              1. Enhanced Restaurant Profile (ព័ត៌មានលម្អិតកម្រិតខ្ពស់)
              2. More Food Photos & Menu Items (រូបភាព និងមុខម្ហូបរហូតដល់ ២០)
              3. Promotional Video Uploads (វីដេអូផ្សព្វផ្សាយម្ហូបអាហារ)
              4. Premium VIP Badge (ផ្លាកសញ្ញាបញ្ជាក់ភាពជា VIP)
              5. Additional Promotional Placement (ការដាក់ផ្សាយពិសេស)
              6. Highlighted Location on Map (ទីតាំងលេចធ្លោលើផែនទី និងរុករក)
              7. Quick Contact Buttons (Call, Telegram, Facebook)
              8. Live View & Contact Statistics (ស្ថិតិអ្នកចូលទស្សនា និងទំនាក់ទំនង)
              9. Shareable Profile Link (តំណភ្ជាប់ចែករំលែកហាង)
              10. Priority Search Visibility (ការបង្ហាញមុនគេក្នុងការស្វែងរក)
            - 💳 **៣. ការទូទាត់ប្រាក់ប្រកបដោយសុវត្ថិភាពខ្ពស់ (Secure Payment Gateway):**
              - គាំទ្រ Google Play Billing, KHQR / Bakong (CHEA KIMSENG), និង Credit/Debit Card។
              - មានផ្ទាំងបញ្ជាក់ព័ត៌មាន (Confirmation Screen) មុនពេលបង់ប្រាក់។
              - ការផ្ទៀងផ្ទាត់ Cryptographic HMAC-SHA256 និងការពារការបន្លំ Duplicate Transactions។
            - ⏳ **៤. គ្រប់គ្រងសុពលភាព និងការបន្តគណនី (Subscription Renewal & Expiry Control):**
              - បង្ហាញកាលបរិច្ឆេទផុតកំណត់ និងចំនួនថ្ងៃនៅសល់យ៉ាងច្បាស់លាស់។
              - គាំទ្រការបន្តសុពលភាពមុនកាលកំណត់ (Renew early) និងការស្ដារការទិញ (Restore Purchases)។
            - 🛡️ **៥. តារាងគ្រប់គ្រង Admin មានសុវត្ថិភាពខ្ពស់** សម្រាប់ពិនិត្យប្រតិបត្តិការ និងការផ្ទៀងផ្ទាត់។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
