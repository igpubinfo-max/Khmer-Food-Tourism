name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main, master, test-ui-apk ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          rm -rf android/app/src/main/assets/public && mkdir -p android/app/src/main/assets/public && cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Signed Android Release APK & Play Store AAB
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease || ./gradlew assembleDebug --no-daemon
          ./gradlew bundleRelease --no-daemon -x lint -x lintVitalRelease

      - name: 9. Locate and Rename Signed APK and AAB Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK & AAB FILES ==="
          find . -name "*.apk" -o -name "*.aab" -ls
          mkdir -p android/app/build/outputs/apk/debug
          REL_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$REL_APK" ] && [ -f "$REL_APK" ]; then
            cp "$REL_APK" android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.3.1.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.3.1.apk
          fi
          REL_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$REL_AAB" ] && [ -f "$REL_AAB" ]; then
            cp "$REL_AAB" android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.3.1-PlayStore.aab
          fi
          ls -la android/app/build/outputs/apk/debug/

      - name: 10. Upload Android Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-Release-Packages
          path: |
            android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.3.1.apk
            android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.3.1-PlayStore.aab

      - name: 11. Publish GitHub Release with Signed APK & Play Store AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.1
          name: "Khmer Food & Tourism v2.3.1"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែផ្លូវការ v2.3.1 (Official Signed Production Packages):**
            - 📦 **KhmerFoodTourism-v2.3.1.apk:** Direct install APK for Android devices.
            - 🚀 **KhmerFoodTourism-v2.3.1-PlayStore.aab:** Signed Android App Bundle for Google Play Store distribution.
            - 🔒 **6-Digit Admin PIN & Anti-Tamper Security:** Mandatory cryptographic PIN verification step & HMAC-SHA256 session integrity seal.
            - 👑 **Synchronized VIP Pricing:** 30 Days ($4.99), 60 Days ($6.99), and Additional Store Package ($5.00).
            - 🎲 **Session-Based Random Order:** Freshly shuffled shops and tourist attractions on every app open.
            - 🗺️ **Geographic 1-Day Trip Planner:** Province filtering & instant GPS location detection.
            - 💎 **3D Luxury VIP Card:** Deep emerald & gold metallic styling with shine effects.
            - 📺 **YouTube Trending Feed:** Real-time YouTube-only video discovery with 60-second background auto-refresh.
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.3.1.apk
            android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.3.1-PlayStore.aab
