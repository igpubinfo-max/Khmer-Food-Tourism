name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.4.7.apk
          ls -la

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.7
          name: "Khmer Food & Tourism v1.4.7 (Continue with Google - 100% Free Forever)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.4.7 (Continue with Google — 100% Free Forever):**
            - 🌟 **១. ចូលគណនីតាម Google ឥតគិតថ្លៃ ១០០% ជារៀងរហូត (Continue with Google):**
              - ចុះឈ្មោះ និងចូលគណនីភ្លាមៗត្រឹមតែ ១-Tap តាមរយៈ Google Account លើទូរស័ព្ទដៃ Android។
              - មិនបាច់រង់ចាំ ឬបង់ថ្លៃសេវាសារ SMS (Zero SMS verification fee)។
              - ផ្ទាំងជ្រើសរើសគណនី Google (Google Account Chooser) បង្ហាញក្នុងកម្មវិធីដោយផ្ទាល់ (Direct in-app account selection)។
              - ទាញយកឈ្មោះ Email និងរូបតំណាង Profile Picture មកបង្កើតគណនីធម្មតា (Normal User Account: `role: 'user'`)។
              - រក្សាទុក session ក្នុងម៉ាស៊ីន និងសម្គាល់អ្នកធ្លាប់ចុះឈ្មោះរួចដើម្បី Login ចូលគណនីដើម ដោយមិនបង្កើតគណនីស្ទួន។
            - 🚪 **២. ចាកចេញពីកម្មវិធីស្វ័យប្រវត្តិប្រសិនបើគ្មានគណនី (Auto-Exit Mandatory Gate)**។
            - 🔐 **៣. សុវត្ថិភាពទិន្នន័យខ្ពស់ និងរក្សាទិន្នន័យមុខម្ហូប រមណីយដ្ឋាន ហាងអាហារទាំងអស់**។
            - 📧 **៤. អាសយដ្ឋានអ៊ីមែលផ្លូវការ `kftcam@gmail.com`**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
