name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.5.1.apk
          ls -la

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.1
          name: "Khmer Food & Tourism v1.5.1 (Streamlined Google Sign-In & Instant Email Auth)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.5.1 (Streamlined Google Sign-In & Zero-Friction User Experience):**
            - 🚀 **១. ផ្ទាំងចុះឈ្មោះថ្មីទាន់សម័យ និងងាយស្រួលបំផុត (Streamlined Welcome Screen):**
              - បានដកចេញប្រអប់លេខទូរស័ព្ទ និង SMS OTP ស្មុគស្មាញ ដើម្បីជៀសវាងការយល់ច្រឡំ និងការចំណាយឥតប្រយោជន៍។
              - បង្ហាញប៊ូតុងធំចម្បង «បន្តជាមួយ Google» (Continue with Google) ចូលប្រើភ្លាមៗក្នុងរយៈពេលតែ ១ វិនាទី (1-Tap Instant Sign-In)។
            - 📧 **២. គាំទ្រការចុះឈ្មោះ និងចូលប្រើតាមអ៊ីមែល (Instant Email Auth)** ដោយឥតគិតថ្លៃ និងមិនបាច់រង់ចាំលេខកូដ។
            - 🌐 **៣. ផ្សាយផ្ទាល់លើ GitHub Pages សម្រាប់ Apple iPhone (PWA Add to Home Screen)** តាមរយៈ `https://igpubinfo-max.github.io/Khmer-Food-Tourism/`។
            - 🚪 **៤. ចាកចេញពីកម្មវិធីស្វ័យប្រវត្តិប្រសិនបើគ្មានគណនី (Auto-Exit Mandatory Gate)**។
            - 🔐 **៥. ឥតគិតថ្លៃ ១០០% ជារៀងរហូត គ្មានការគិតថ្លៃសេវា SMS (Zero SMS fees)**។
            - 📧 **៦. អាសយដ្ឋានអ៊ីមែលផ្លូវការ `kftcam@gmail.com`**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
