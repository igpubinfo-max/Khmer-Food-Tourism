name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 7. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.4.6.apk
          ls -la

      - name: 9. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 10. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.6
          name: "Khmer Food & Tourism v1.4.6 (Remove Duplicate Exit Button & Test Mode Helper)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.4.6 (Fix Duplicate Exit Button & SMS Test Mode Helper):**
            - 🚪 **១. កែសម្រួលប៊ូតុង Exit App៖** លុបបំបាត់ប៊ូតុងចាកចេញជាន់គ្នា (Removed duplicate Exit App button) នៅសល់ប៊ូតុងតែមួយនៅផ្នែកខាងក្រោមយ៉ាងស្រស់ស្អាត។
            - 💡 **២. ជំនួយការតេស្តលេខទូរស័ព្ទ (SMS Test Mode Helper):** បញ្ជាក់ការណែនាំអំពីប្រព័ន្ធ SMS Gateway (Plasgate Cambodia) និងផ្ដល់លេខកូដសាកល្បង `123456` ដើម្បីងាយស្រួលតេស្តលើទូរស័ព្ទដៃភ្លាមៗ។
            - 📲 **៣. ជម្រើសចូលគណនីលឿនបំផុត (Continue with Google):** ចុចចូលភ្លាមៗ 1-Tap មិនបាច់ចាំលេខកូដ SMS។
            - 🔐 **៤. រក្សាសុវត្ថិភាព និងការចាកចេញដោយស្វ័យប្រវត្តិប្រសិនបើគ្មានគណនី (Auto-Exit Gate)**។
            - 📧 **៥. អាសយដ្ឋានអ៊ីមែលផ្លូវការ `kftcam@gmail.com`**។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
