name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Signed Android Release APK (V1/V2/V3 Play Protect Verified)
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease || ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename Signed APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          mkdir -p android/app/build/outputs/apk/debug
          REL_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$REL_APK" ] && [ -f "$REL_APK" ]; then
            cp "$REL_APK" android/app/build/outputs/apk/debug/KhmerFoodTourism-v1.9.8.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KhmerFoodTourism-v1.9.8.apk
          fi
          ls -la android/app/build/outputs/apk/debug/

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.8
          name: "Khmer Food & Tourism v1.9.8 (3-Option Admin Account Management, VIP Personalized Features Lock & New App Icon)"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.9.8 (Build 70):**
            - 🛡️ **១. ផ្ទាំងគ្រប់គ្រងគណនីអ្នកប្រើប្រាស់ ៣ ជម្រើសសម្រាប់ Admin (3-Option Admin Account Management Dialog)៖**
              - **ជម្រើសទី ១ — បោះបង់សមាជិកភាព VIP (Cancel VIP)៖** ដកសិទ្ធិ និងអត្ថប្រយោជន៍ VIP ហើយប្តូរមកជាអ្នកប្រើប្រាស់ធម្មតា (Normal User) ដោយរក្សាទុកគណនី អ៊ីមែល ពាក្យសម្ងាត់ និងសិទ្ធិចូលប្រើប្រាស់ ១០០%។
              - **ជម្រើសទី ២ — ស្តារសិទ្ធិចូលប្រើប្រាស់គណនីឡើងវិញ (Restore User Access)៖** បើកដំណើរការគណនីដែលត្រូវបានផ្អាក ឬលុបបណ្តោះអាសន្នឡើងវិញឱ្យអាចចូលប្រើកម្មវិធីជាមួយអ៊ីមែលដដែល (សម្រាប់គណនីដែលមិនទាន់លុបជាអចិន្ត្រៃយ៍)។
              - **ជម្រើសទី ៣ — លុបគណនីជាអចិន្ត្រៃយ៍ (Delete Forever)៖** លុបគណនី និងទិន្នន័យពាក់ព័ន្ធទាំងអស់ជាអចិន្ត្រៃយ៍បន្ទាប់ពីធីកបញ្ជាក់យល់ព្រមយ៉ាងច្បាស់លាស់ ព្រមទាំងមានប៊ូតុង **បោះបង់ (Cancel)** ដាច់ដោយឡែក។
            - 🔒 **២. ការគ្រប់គ្រងសិទ្ធិ VIP សម្រាប់មុខងារផ្ទាល់ខ្លួនទាំង ៦ (VIP Access Control for Personalized Features)៖**
              - ចាក់សោមុខងារផ្ទាល់ខ្លួនទាំង ៦ (`ថ្ងៃនេះញ៉ាំអ្វី?`, `នៅជិតខ្ញុំ`, `កន្លែងថ្មីប្រចាំថ្ងៃ`, `បញ្ជីកន្លែងចង់ទៅ`, `ផែនការដើរលេង AI`, `ការជូនដំណឹង`) សម្រាប់អ្នកប្រើប្រាស់ឥតគិតថ្លៃ (Free Users) និងផ្ទៀងផ្ទាត់សិទ្ធិ VIP ទាំងលើផ្ទៃ UI និង Backend/Context។
              - បិទសិទ្ធិប្រើប្រាស់ដោយស្វ័យប្រវត្តិ និងបង្ហាញផ្ទាំងដំឡើងទៅ VIP ភ្លាមៗនៅពេលគណនីផុតកំណត់ ឬត្រូវបានបោះបង់ VIP។
            - 🎨 **៣. ប្តូររូបតំណាងកម្មវិធីថ្មី (New App Icon)៖**
              - ធ្វើបច្ចុប្បន្នភាពរូបតំណាងកម្មវិធីថ្មីកម្រិតច្បាស់ខ្ពស់នៅគ្រប់ទំហំ Android Adaptive Launcher (`mipmap-*`) និង PWA Icons។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
