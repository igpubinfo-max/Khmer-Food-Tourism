name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename APK Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find . -name "*.apk" -ls
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk KhmerFoodTourism-v1.5.4.apk
          ls -la

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: 11. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.4
          name: "Khmer Food & Tourism v1.5.4 (Authentic Shop Photos, Scenic Food Locations & Admin AI Check-in)"
          overwrite: true
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v1.5.4 (Authentic Shop Photos, Scenic Food Locations & Admin AI Check-in):**
            - 🏪 **១. បច្ចុប្បន្នភាពរូបភាពហាងពិតជាក់ស្តែង (Authentic Local Shop Photos):**
              - បានបញ្ចូលរូបភាពហាងពិតចំនួន ៤៩ ហាង ពីថតរូប Shop (rest-1 ដល់ rest-50) ទៅក្នុងកញ្ចប់កម្មវិធី APK ផ្ទាល់ ជំនួសរូបភាពគំរូទូទៅ។
            - 🏞️ **២. រូបភាពទីតាំង & ភូមិដ្ឋានមុខម្ហូបល្បីៗ (Scenic Location & Village Scenery):**
              - មុខម្ហូបល្បីៗ AI Trending Food ត្រូវបានកែសម្រួលរូបភាពមកជារូបភាពទីតាំង ភូមិដ្ឋាន ផ្សារបុរាណ និងទេសភាពធម្មជាតិដែលម្ហូបនោះតាំងនៅ ដូចជានៅក្រុងបាត់ដំបង កែប កំពត ភ្នំពេញ កោះកុង សៀមរាប និងកំពង់ចាម ដូចគ្នាទៅនឹងរូបភាពទេសចរណ៍។
              - ស្លាកបង្ហាញលើរូបភាពត្រូវបានប្តូរជា «រូបភាពទីតាំង / ភូមិដ្ឋាន» (Location / Village Scenery)។
            - 🛡️ **៣. កំណត់សិទ្ធិមុខងារឆែកអ៊ីន AI សម្រាប់តែ Administrator ប៉ុណ្ណោះ (Admin Only AI Check-in):**
              - ប៊ូតុងឆែកអ៊ីន & បន្ថែមហាងដោយ AI (AI Smart Check-in) បង្ហាញជូនតែគណនី Administrator ប៉ុណ្ណោះ។
              - បន្ថែមប៊ូតុងចុះឈ្មោះហាងដោយ AI ផ្ទាល់នៅក្នុងផ្ទាំងគ្រប់គ្រង Admin Dashboard។
              - ការពារប្រព័ន្ធ Backend និង Logic មិនឱ្យគណនីទូទៅអាចបញ្ជូនទិន្នន័យឆែកអ៊ីនដោយគ្មានការអនុញ្ញាតឡើយ។
            - 📱 **១. កែសម្រួលទំព័រដើម (Home Screen Layout):**
              - បានផ្លាស់ប្តូរផ្នែក “TikTok & FB Review” ឡើងលើ ស្ថិតនៅក្រោមផ្នែក Account/Profile (Member Hub) ដោយផ្ទាល់។
              - រក្សាព័ត៌មានគណនី និងមុខងារផ្ទាល់ខ្លួនទាំង ៦ ឱ្យនៅដដែល មិនប៉ះពាល់ ឬបាំងបិទផ្នែកណាមួយឡើយ។
              - របាររុករកខាងក្រោម (Bottom Navigation) ជាប់នឹងកន្លែង និងរលូនល្អឥតខ្ចោះ។
            - 🍲 **២. ផ្នែកអាហារល្បី AI Trending Food (TikTok & FB Review):**
              - ផ្តោតតែលើហាងអាហារឆ្ងាញ់ៗ ប្លែកៗ ពេញនិយម និងល្បីល្បាញក្នុងប្រទេសកម្ពុជា (គ្មានរមណីយដ្ឋាន ឬកន្លែងទេសចរណ៍លាយឡំ)។
              - ស្វែងយល់ហាងអាហារ អាហារតាមផ្លូវ កាហ្វេ បង្អែម អាហារសម្រន់ និងមុខម្ហូបប្រចាំតំបន់ដែលល្បីលើ TikTok & Facebook។
              - បង្ហាញរូបថតពិត ឈ្មោះហាង ទីតាំង សម្រង់សម្តី Reviewer កាលបរិច្ឆេទធ្វើបច្ចុប្បន្នភាព និងតំណភ្ជាប់ប្រភពដើម។
              - ប៊ូតុងសកម្មភាពរហ័សទាំង ៤៖ View Details (មើលលម្អិត), Map (នាំផ្លូវ), Call (ទូរស័ព្ទ), និង Share (ចែករំលែក)។
              - Filter តាមប្រភេទអាហារ និងតាមរាជធានី-ខេត្តទូទាំងប្រទេសកម្ពុជា។
            - 📸 **៣. មុខងារថ្មី៖ ឆែកអ៊ីន & បន្ថែមហាងដោយ AI (AI Smart Check-in):**
              - ថតរូបស្លាកហាង ឬមុខម្ហូបផ្ទាល់តាមកាមេរ៉ា ឬជ្រើសរើសពីរូបថតក្នុងទូរស័ព្ទ។
              - ចាប់យកទីតាំង GPS ដោយស្វ័យប្រវត្តិតាមរយៈទូរស័ព្ទ។
              - AI Image Recognition & OCR ស្គែនអក្សរលើស្លាកហាង ស្វែងរកឈ្មោះហាង ប្រភេទអាហារ អាសយដ្ឋាន និងលេខទូរស័ព្ទ។
              - បើសិនជារូបថតមានតែម្ហូប គ្មានស្លាកហាង ប្រព័ន្ធនឹងសួរឈ្មោះហាងពីអ្នកប្រើ (មិនប្រឌិតព័ត៌មានឡើយ)។
            - 🛡️ **៤. ប្រព័ន្ធទប់ស្កាត់ភាពស្ទួន (AI Duplicate Detection & Merging):**
              - ពិនិត្យឈ្មោះជាភាសាខ្មែរ និងអង់គ្លេស លេខទូរស័ព្ទ និងចម្ងាយ GPS (<២០០ ម៉ែត្រ)។
              - ប្រសិនបើមានហាងស្រដៀងគ្នា នឹងកត់ត្រាការឆែកអ៊ីនទៅកាន់ហាងចាស់ (Update) ដោយមិនបង្កើតទិន្នន័យស្ទួន។
              - បែងចែកសាខាផ្សេងគ្នានៃហាងតែមួយបានយ៉ាងត្រឹមត្រូវ (គម្លាត >៥០០ ម៉ែត្រ)។
            - 🚀 **៥. ដំណើរការចុះផ្សាយស្វ័យប្រវត្តិ & Admin Review Queue:**
              - ចុះផ្សាយស្វ័យប្រវត្តិប្រសិនបើ AI មានទំនុកចិត្តខ្ពស់ (>=80%)។
              - បញ្ជូនទៅកាន់ Admin Review Queue ប្រសិនបើព័ត៌មានមិនទាន់គ្រប់គ្រាន់ ដើម្បីឱ្យ Admin ពិនិត្យ អនុម័ត ឬច្របាច់បញ្ចូលគ្នា (Merge)។
              - ការពារ Spam & Rate Limiting (អតិបរមា ១០ ដង/ម៉ោង ក្នុងម្នាក់) និងការពារសុវត្ថិភាពឯកជនភាពអ្នកប្រើប្រាស់។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
