name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Build Web Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: 6. Deploy Web App to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: 7. Copy Web Assets directly into Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -rf dist/* android/app/src/main/assets/public/

      - name: 8. Build Signed Android Release APK & Google Play Store AAB (V1/V2/V3 Play Protect Verified)
        run: |
          if [ ! -f android/app/khmerfood-upload-key.jks ]; then
            keytool -genkeypair -v -noprompt \
              -keystore android/app/khmerfood-upload-key.jks \
              -alias khmerfood-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 'KhmerFood2026PlayStore' \
              -keypass 'KhmerFood2026PlayStore' \
              -dname "CN=Savuth Chea, OU=Khmer Food and Tourism, O=Khmer Food and Tourism, L=Phnom Penh, ST=Phnom Penh, C=KH"
          fi
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon -x lint -x lintVitalRelease || ./gradlew assembleDebug --no-daemon

      - name: 9. Locate and Rename Signed APK & Play Store AAB Files
        run: |
          echo "=== SEARCHING FOR GENERATED APK & AAB FILES ==="
          find . -name "*.apk" -o -name "*.aab" -ls
          mkdir -p android/app/build/outputs/apk/debug
          REL_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$REL_APK" ] && [ -f "$REL_APK" ]; then
            cp "$REL_APK" android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.1.0.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.1.0.apk
          fi
          REL_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$REL_AAB" ] && [ -f "$REL_AAB" ]; then
            cp "$REL_AAB" android/app/build/outputs/apk/debug/KhmerFoodTourism-v2.1.0-PlayStore.aab
          fi
          ls -la android/app/build/outputs/apk/debug/

      - name: 10. Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Food-Tourism-Release-Packages
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.aab

      - name: 11. Publish GitHub Release with APK & Play Store AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.0
          name: "Khmer Food & Tourism v2.1.0 (Build 78: Upgraded AI Food Assistant + 200-Dish Visual Reference Index + Permanent Photos)"
          make_latest: true
          body: |
            ### 🇰🇭 កម្មវិធីទូរស័ព្ទដៃ អាហារ និងទេសចរណ៍ខ្មែរ (Khmer Food & Tourism Mobile App)
            
            **កំណែថ្មី v2.1.0 (Build 78):**
            - 🤖 **១. ជំនួយការ AI ស្វែងរកមុខម្ហូបខ្មែរកម្រិតខ្ពស់ (Upgraded AI Cambodian Food Assistant & 200-Dish Visual Reference Index)៖**
              - បំពាក់ប្រព័ន្ធផ្ទៀងផ្ទាត់រចនាសម្ព័ន្ធរូបភាព 8×8 Perceptual Reference Index លើមុខម្ហូបខ្មែរទាំង ២០០ មុខ រួមជាមួយការវិភាគលក្ខណៈម្ហូប ១២ ប្រភេទ (ពងទាកូនទឹកម្រេចក្រូចឆ្មាកំពត, ឆាគ្រឿងអន្ទង់ស្លឹកម្រះព្រៅ, ត្រីងៀតអាំងជ្រលក់ទឹកអម្ពិលទុំ, ញាំមីសួរគ្រឿងសមុទ្របង្គាមឹក, សម្លកកូរ, អាម៉ុកត្រី ។ល។) ដោយដាក់មុខម្ហូបដែលត្រូវបំផុតនៅលំដាប់ទី ១ (#1) ជាមួយជម្រើសប្រហាក់ប្រហែល ៥ មុខ (មានរូបភាពគំរូ និងភាគរយប្រហាក់ប្រហែល) ដើម្បីឱ្យអ្នកប្រើប្រាស់បញ្ជាក់ជ្រើសរើសដោយ 1-Tap។
            - 💳 **២. ប្រព័ន្ធធ្វើសមកាលកម្មតម្លៃកញ្ចប់ VIP ពី Server កណ្តាលភ្លាមៗ (Real-Time VIP Pricing Synchronization)៖**
              - តម្លៃកញ្ចប់ VIP 30 ថ្ងៃ និង 90 ថ្ងៃ ព្រមទាំងអត្ថប្រយោជន៍ដែល Admin កែប្រែ នឹងបង្ហាញដូចគ្នាគ្រប់ឧបករណ៍ និងគ្រប់គណនីភ្លាមៗ។
            - 🏛️ **៣. រក្សាទុករូបភាពប្រាសាទ និងរមណីយដ្ឋានទេសចរណ៍ថ្មីៗជាអចិន្ត្រៃយ៍ (Permanent Temple & Destination Photos - 62 Updated Locations)៖**
              - រូបភាពប្រាសាទ និងរមណីយដ្ឋានដែលបានកែប្រែថ្មីទាំងអស់ ត្រូវបានបង្កប់ជាអចិន្ត្រៃយ៍ក្នុងកម្មវិធី និងរក្សាទុកក្នុងប្រព័ន្ធការពារ ៣ ជាន់ (Static Bundle + IndexedDB + Supabase Cloud)។
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.aab
